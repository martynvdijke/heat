version: '3'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  install:
    desc: Install all dependencies (Go, NPM, Playwright)
    cmds:
      - go mod download
      - npm install
      - npx playwright install --with-deps chromium
      - task: build:ts

  fmt:
    desc: Format code (Go)
    cmds:
      - go fmt ./...

  test:
    desc: Run Go unit and database tests
    cmds:
      - go test -v ./...

  test:e2e:
    desc: Run Playwright end-to-end tests
    cmds:
      - rm -f heat.db heat.db-wal heat.db-shm
      - npx playwright test

  build:ts:
    desc: Compile TypeScript to JavaScript
    cmds:
      - npm run build:ts

  build:
    desc: Build the Go binary
    cmds:
      - task: build:ts
      - go build -o heat-server .

  vuln:
    desc: Run Go vulnerability scan
    cmds:
      - go vet ./...
      - test -f $(go env GOPATH)/bin/govulncheck || go install golang.org/x/vuln/cmd/govulncheck@latest
      - $(go env GOPATH)/bin/govulncheck ./...

  pre-push:
    desc: Run all checks before pushing
    cmds:
      - task: fmt
      - task: test
      - task: vuln
      - task: build:ts
      - task: build

  run:
    desc: Run the application locally
    cmds:
      - go run main.go

  dev:
    desc: Run with hot-reload (Air)
    cmds:
      - air

  docker:build:
    desc: Build Docker image
    cmds:
      - docker build . -t heat:local

  clean:
    desc: Clean build artifacts and local database
    cmds:
      - rm -f heat-server
      - rm -f heat.db
      - rm -rf playwright-report
      - rm -rf test-results

  all:
    desc: Run format, test, and build
    cmds:
      - task: fmt
      - task: test
      - task: build
