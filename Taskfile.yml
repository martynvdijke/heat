version: '3'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  install:
    desc: Install all dependencies (Go, NPM, Playwright)
    cmds:
      - go mod download
      - npm install
      - npx playwright install --with-deps chromium
      - task: build:frontend

  fmt:
    desc: Format code (Go)
    cmds:
      - go fmt ./...

  test:
    desc: Run Go unit and database tests
    cmds:
      - go test -v ./...

  test:e2e:
    desc: Run Playwright end-to-end tests
    cmds:
      - rm -f heat.db heat.db-wal heat.db-shm
      - npx playwright test

  build:frontend:
    desc: Build frontend (esbuild production)
    cmds:
      - npm run build:frontend

  build:frontend:dev:
    desc: Build frontend with sourcemaps (dev)
    cmds:
      - npm run build:frontend:dev

  typecheck:
    desc: TypeScript type-checking (no emit)
    cmds:
      - npm run typecheck

  build:ts:
    desc: Compile TypeScript to JavaScript
    cmds:
      - npm run build:ts

  generate-swagger:
    desc: Generate Swagger/OpenAPI documentation from annotations
    cmds:
      - test -f $(go env GOPATH)/bin/swag || go install github.com/swaggo/swag/cmd/swag@latest
      - $(go env GOPATH)/bin/swag init --parseDependency --parseInternal

  build:
    desc: Build the Go binary
    cmds:
      - task: build:frontend
      - go build -o heat-server .

  pre-push:
    desc: Run all checks before pushing
    cmds:
      - task: fmt
      - task: generate-swagger
      - task: test
      - task: typecheck
      - task: build:frontend
      - task: build

  run:
    desc: Run the application locally
    cmds:
      - go run main.go

  dev:
    desc: Run with hot-reload (Air)
    cmds:
      - air

  docker:build:
    desc: Build Docker image
    cmds:
      - docker build . -t heat:local

  clean:
    desc: Clean build artifacts and local database
    cmds:
      - rm -f heat-server
      - rm -f heat.db
      - rm -rf playwright-report
      - rm -rf test-results

  all:
    desc: Run format, test, and build
    cmds:
      - task: fmt
      - task: test
      - task: build
