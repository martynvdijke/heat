definitions:
  handlers.ExtensionDetail:
    properties:
      description:
        type: string
      id:
        type: integer
      is_base:
        type: integer
      legends:
        items:
          $ref: '#/definitions/models.LegendAbility'
        type: array
      modules:
        items:
          additionalProperties: {}
          type: object
        type: array
      name:
        type: string
      tracks:
        items:
          $ref: '#/definitions/models.Track'
        type: array
      upgrades:
        items:
          $ref: '#/definitions/models.UpgradeCard'
        type: array
    type: object
  handlers.ExtensionSummary:
    properties:
      description:
        type: string
      id:
        type: integer
      is_base:
        type: integer
      legend_count:
        type: integer
      module_count:
        type: integer
      name:
        type: string
      owned:
        type: boolean
      sort_order:
        type: integer
      track_count:
        type: integer
      upgrade_count:
        type: integer
    type: object
  handlers.ModuleSummary:
    properties:
      description:
        type: string
      extension:
        type: string
      extension_id:
        type: integer
      id:
        type: integer
      name:
        type: string
      sort_order:
        type: integer
    type: object
  handlers.logSettingInput:
    properties:
      level:
        type: string
      module:
        type: string
    required:
    - level
    - module
    type: object
  models.AISettings:
    properties:
      api_key:
        type: string
      enabled:
        type: boolean
      id:
        type: integer
      track_extract_url:
        type: string
    type: object
  models.BackupSettings:
    properties:
      enabled:
        type: boolean
      id:
        type: integer
      interval_hrs:
        type: integer
      retention_count:
        type: integer
    type: object
  models.EmailSettings:
    properties:
      enabled:
        type: boolean
      from_addr:
        type: string
      id:
        type: integer
      password:
        type: string
      smtp_host:
        type: string
      smtp_port:
        type: integer
      username:
        type: string
    type: object
  models.FlagCommand:
    properties:
      flag:
        type: string
      racer_id:
        type: integer
      racer_name:
        type: string
      state:
        type: string
      type:
        type: string
    type: object
  models.HeadToHead:
    properties:
      racer1:
        type: string
      racer1_avg_position:
        type: number
      racer1_wins:
        type: integer
      racer2:
        type: string
      racer2_avg_position:
        type: number
      racer2_wins:
        type: integer
      races:
        type: integer
    type: object
  models.LegendAbility:
    properties:
      ability_type:
        type: string
      description:
        type: string
      extension_id:
        type: integer
      id:
        type: integer
      name:
        type: string
      racer_name:
        type: string
    type: object
  models.NotificationSettings:
    properties:
      gotify_token:
        type: string
      gotify_url:
        type: string
      id:
        type: integer
      notify_podium:
        type: boolean
      notify_race_start:
        type: boolean
      notify_winner:
        type: boolean
    type: object
  models.OTelSettings:
    properties:
      endpoint:
        type: string
      id:
        type: integer
      logs_enabled:
        type: boolean
      metrics_enabled:
        type: boolean
      traces_enabled:
        type: boolean
    type: object
  models.Quote:
    properties:
      author:
        type: string
      created_at:
        type: string
      id:
        type: integer
      text:
        type: string
    type: object
  models.RaceHistory:
    properties:
      country:
        type: string
      id:
        type: integer
      name:
        type: string
      race_date:
        type: string
      race_type:
        type: string
      results:
        items:
          $ref: '#/definitions/models.RaceResult'
        type: array
      total_laps:
        type: integer
      track:
        type: string
      track_id:
        type: string
    type: object
  models.RaceInfo:
    properties:
      country:
        type: string
      id:
        type: integer
      laps:
        type: integer
      next_race_date:
        type: string
      track:
        type: string
      track_id:
        type: string
    type: object
  models.RaceResult:
    properties:
      fastest_lap:
        type: boolean
      finished:
        type: boolean
      id:
        type: integer
      points:
        type: integer
      position:
        type: integer
      race_id:
        type: integer
      racer_id:
        type: integer
      racer_name:
        type: string
    type: object
  models.Racer:
    properties:
      car_color:
        type: string
      car_name:
        type: string
      id:
        type: integer
      name:
        type: string
      points:
        type: integer
      position:
        type: integer
      profile_picture:
        type: string
      rank:
        type: integer
      team_color:
        type: string
      team_id:
        type: integer
      team_name:
        type: string
    type: object
  models.RacerEmail:
    properties:
      email:
        type: string
      id:
        type: integer
      racer_id:
        type: integer
    type: object
  models.RacerRankUpdate:
    properties:
      id:
        type: integer
      rank:
        type: integer
    type: object
  models.RacerStats:
    properties:
      bronze:
        type: integer
      dnf:
        type: integer
      dns:
        type: integer
      fastest_laps:
        type: integer
      gold:
        type: integer
      id:
        type: integer
      overheated:
        type: integer
      points:
        type: integer
      racer_id:
        type: integer
      races:
        type: integer
      silver:
        type: integer
      spins:
        type: integer
      wins:
        type: integer
    type: object
  models.RoundSnapshot:
    properties:
      created_at:
        type: string
      id:
        type: integer
      race_date:
        type: string
      race_name:
        type: string
      round:
        type: integer
      scores:
        items:
          $ref: '#/definitions/models.RoundSnapshotScore'
        type: array
      season_id:
        type: integer
      status:
        type: string
    type: object
  models.RoundSnapshotScore:
    properties:
      dnf:
        type: boolean
      dns:
        type: boolean
      id:
        type: integer
      overheated:
        type: integer
      points:
        type: integer
      position:
        type: integer
      racer_id:
        type: integer
      racer_name:
        type: string
      snapshot_id:
        type: integer
      spins:
        type: integer
    type: object
  models.Season:
    properties:
      created_at:
        type: string
      end_date:
        type: string
      id:
        type: integer
      module_ids:
        items:
          type: integer
        type: array
      name:
        type: string
      start_date:
        type: string
      status:
        type: string
    type: object
  models.Track:
    properties:
      country:
        type: string
      extension_id:
        type: integer
      geojson:
        type: string
      id:
        type: string
      is_board_game:
        type: boolean
      lap_record:
        type: string
      length_km:
        type: integer
      map_image_url:
        type: string
      module_id:
        type: integer
      name:
        type: string
      refresh_geojson:
        type: boolean
      use_map_image:
        type: boolean
    type: object
  models.TrackStats:
    properties:
      country:
        type: string
      fastest_lap:
        type: string
      races_count:
        type: integer
      track_id:
        type: string
      track_name:
        type: string
      winner:
        type: string
    type: object
  models.UmamiSettings:
    properties:
      enabled:
        type: boolean
      id:
        type: integer
      url:
        type: string
      website_id:
        type: string
    type: object
  models.UpgradeCard:
    properties:
      card_type:
        description: upgrade, legendary, sponsorship
        type: string
      cost:
        type: integer
      description:
        type: string
      effects:
        description: JSON string of effects
        type: string
      extension_id:
        type: integer
      id:
        type: integer
      name:
        type: string
    type: object
  models.Upload:
    properties:
      created_at:
        type: string
      ext:
        type: string
      hash:
        type: string
      id:
        type: integer
      resized_url:
        type: string
      thumbnail_url:
        type: string
      url:
        type: string
    type: object
info:
  contact: {}
paths:
  /api/admin/log-settings:
    get:
      description: Get the current log verbosity settings per module
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - cookieAuth: []
      summary: Get log settings
      tags:
      - Logs
    post:
      consumes:
      - application/json
      description: Update log verbosity settings for one or more modules
      parameters:
      - description: Log settings array
        in: body
        name: settings
        required: true
        schema:
          items:
            $ref: '#/definitions/handlers.logSettingInput'
          type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - cookieAuth: []
      summary: Save log settings
      tags:
      - Logs
  /api/admin/logs:
    get:
      description: Get paginated application logs with optional level/module filtering
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Entries per page (default 50)
        in: query
        name: pageSize
        type: integer
      - description: Filter by level (DEBUG, INFO, WARN, ERROR)
        in: query
        name: level
        type: string
      - description: Filter by module name
        in: query
        name: module
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - cookieAuth: []
      summary: Get application logs
      tags:
      - Logs
  /api/admin/logs/modules:
    get:
      description: Get distinct module names from the logs
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
      security:
      - cookieAuth: []
      summary: Get log modules
      tags:
      - Logs
  /api/ai-settings:
    get:
      description: Get the AI track extraction settings
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - cookieAuth: []
      summary: Get AI settings
      tags:
      - Settings
    post:
      consumes:
      - application/json
      description: Save the AI track extraction settings
      parameters:
      - description: AI settings
        in: body
        name: settings
        required: true
        schema:
          $ref: '#/definitions/models.AISettings'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - cookieAuth: []
      summary: Save AI settings
      tags:
      - Settings
  /api/backup-settings:
    get:
      description: Get the backup configuration settings
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BackupSettings'
      summary: Get backup settings
      tags:
      - Backup
    post:
      consumes:
      - application/json
      description: Save the backup configuration settings
      parameters:
      - description: Backup settings
        in: body
        name: settings
        required: true
        schema:
          $ref: '#/definitions/models.BackupSettings'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Save backup settings
      tags:
      - Backup
  /api/backup/list:
    get:
      description: List recent backup files
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: object
            type: array
      summary: List backups
      tags:
      - Backup
  /api/backup/manual:
    post:
      description: Trigger a manual database backup
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - cookieAuth: []
      summary: Create manual backup
      tags:
      - Backup
  /api/check-setup:
    get:
      description: Returns whether an admin user has been created
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
      summary: Check if admin is set up
      tags:
      - Auth
  /api/content/extension:
    put:
      consumes:
      - application/json
      description: Assign a track, upgrade card, or legend ability to an extension
      parameters:
      - description: Assignment
        in: body
        name: body
        required: true
        schema:
          type: object
      responses:
        "200":
          description: OK
      security:
      - cookieAuth: []
      summary: Assign content to extension
      tags:
      - Extensions
  /api/email-settings:
    get:
      description: Get SMTP email settings
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - cookieAuth: []
      summary: Get email settings
      tags:
      - Settings
    post:
      consumes:
      - application/json
      description: Save SMTP email settings
      parameters:
      - description: Email settings
        in: body
        name: settings
        required: true
        schema:
          $ref: '#/definitions/models.EmailSettings'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - cookieAuth: []
      summary: Save email settings
      tags:
      - Settings
  /api/extensions:
    delete:
      description: Delete an extension; its content is reset to the Base Game extension
        and its modules (and season module links) are removed
      parameters:
      - description: Extension ID
        in: query
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
      security:
      - cookieAuth: []
      summary: Delete extension
      tags:
      - Extensions
    get:
      description: List all extensions with content counts (tracks, upgrades, legends,
        modules)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.ExtensionSummary'
            type: array
      security:
      - cookieAuth: []
      summary: List extensions
      tags:
      - Extensions
    post:
      consumes:
      - application/json
      description: Create a new extension pack
      parameters:
      - description: Extension
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ExtensionSummary'
      security:
      - cookieAuth: []
      summary: Create extension
      tags:
      - Extensions
    put:
      consumes:
      - application/json
      description: Update an extension's fields
      responses: {}
      security:
      - cookieAuth: []
      summary: Update extension
      tags:
      - Extensions
  /api/extensions/detail:
    get:
      description: Get one extension with its modules, tracks, upgrade cards, and
        legend abilities
      parameters:
      - description: Extension ID
        in: query
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ExtensionDetail'
      security:
      - cookieAuth: []
      summary: Extension detail
      tags:
      - Extensions
  /api/extensions/owned:
    get:
      description: Return the ids of the extensions the group owns; the Base Game
        is always included
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              items:
                type: integer
              type: array
            type: object
      security:
      - cookieAuth: []
      summary: List owned extensions
      tags:
      - Extensions
    put:
      consumes:
      - application/json
      description: Full-replace the owned extension set; the Base Game is always re-added
        and unknown ids are ignored
      responses: {}
      security:
      - cookieAuth: []
      summary: Set owned extensions
      tags:
      - Extensions
  /api/flags:
    post:
      consumes:
      - application/json
      description: Send a flag command (safety car, red, blue, black/white)
      parameters:
      - description: Flag command
        in: body
        name: flag
        required: true
        schema:
          $ref: '#/definitions/models.FlagCommand'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Send race flag command
      tags:
      - Flags
  /api/forgot-password:
    post:
      consumes:
      - application/json
      description: Request a password reset link for an admin account. Always returns
        200 to avoid user enumeration.
      parameters:
      - description: Email address
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Request a password reset
      tags:
      - Auth
  /api/login:
    post:
      consumes:
      - application/json
      description: Login with existing credentials or create the first admin account
        during setup
      parameters:
      - description: Login credentials
        in: body
        name: credentials
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login or create admin account
      tags:
      - Auth
  /api/logout:
    post:
      description: Clear the session cookie and logout
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - cookieAuth: []
      summary: Logout
      tags:
      - Auth
  /api/modules:
    delete:
      description: Delete a gameplay module and its season links
      parameters:
      - description: Module ID
        in: query
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
      security:
      - cookieAuth: []
      summary: Delete module
      tags:
      - Extensions
    get:
      description: List all gameplay modules with their owning extension
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.ModuleSummary'
            type: array
      security:
      - cookieAuth: []
      summary: List modules
      tags:
      - Extensions
    post:
      consumes:
      - application/json
      description: Create a gameplay module, optionally owned by an extension
      responses: {}
      security:
      - cookieAuth: []
      summary: Create module
      tags:
      - Extensions
    put:
      consumes:
      - application/json
      description: Update a gameplay module
      responses: {}
      security:
      - cookieAuth: []
      summary: Update module
      tags:
      - Extensions
  /api/notification-settings:
    get:
      description: Get Gotify notification settings
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - cookieAuth: []
      summary: Get notification settings
      tags:
      - Settings
    post:
      consumes:
      - application/json
      description: Save Gotify notification settings
      parameters:
      - description: Notification settings
        in: body
        name: settings
        required: true
        schema:
          $ref: '#/definitions/models.NotificationSettings'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - cookieAuth: []
      summary: Save notification settings
      tags:
      - Settings
  /api/oneoff-races:
    delete:
      description: Delete a one-off race history entry by ID
      parameters:
      - description: Race ID
        in: query
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - cookieAuth: []
      summary: Delete a one-off race
      tags:
      - Race
    get:
      description: Get the list of one-off race history entries
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.RaceHistory'
            type: array
      summary: Get one-off races
      tags:
      - Race
  /api/otel-settings:
    get:
      description: Get the OpenTelemetry endpoint settings
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.OTelSettings'
      security:
      - cookieAuth: []
      summary: Get OTel settings
      tags:
      - Settings
    post:
      consumes:
      - application/json
      description: Save the OpenTelemetry endpoint settings
      parameters:
      - description: OTel settings
        in: body
        name: settings
        required: true
        schema:
          $ref: '#/definitions/models.OTelSettings'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - cookieAuth: []
      summary: Save OTel settings
      tags:
      - Settings
  /api/quote/random:
    get:
      description: Get a random racing quote
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Quote'
      summary: Get a random quote
      tags:
      - Quotes
  /api/quotes:
    get:
      description: Get the list of all quotes
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Quote'
            type: array
      summary: Get all quotes
      tags:
      - Quotes
    post:
      consumes:
      - application/json
      description: Create a new quote
      parameters:
      - description: Quote data
        in: body
        name: quote
        required: true
        schema:
          $ref: '#/definitions/models.Quote'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Quote'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - cookieAuth: []
      summary: Create a quote
      tags:
      - Quotes
  /api/race-history:
    delete:
      description: Delete a race history entry by ID
      parameters:
      - description: Race ID
        in: query
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
