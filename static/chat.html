<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEAT: Live Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <style>
        .chat-container { height: calc(100vh - 250px); display: flex; flex-direction: column; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 1rem; }
        .chat-input-area { padding: 1rem; border-top: 1px solid var(--border-color, #333); }
        .message { margin-bottom: 1rem; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .message-system { 
            text-align: center; color: var(--primary); font-style: italic;
            padding: 0.5rem 1rem; background: rgba(255,255,255,0.05); border-radius: 20px;
        }
        .message-commentary {
            background: rgba(255,193,7,0.1); border-left: 3px solid #ffc107;
            padding: 0.75rem 1rem; border-radius: 0 12px 12px 12px;
        }
        .message-user {
            background: rgba(255,255,255,0.1); border-radius: 12px; padding: 0.75rem 1rem;
        }
        .message-admin {
            background: rgba(76,175,80,0.2); border-left: 3px solid #4caf50;
            padding: 0.75rem 1rem; border-radius: 0 12px 12px 12px;
        }
        .live-indicator {
            display: inline-flex; align-items: center; gap: 0.5rem;
            background: rgba(244,67,54,0.2); padding: 0.25rem 0.75rem; border-radius: 20px;
        }
        .live-dot {
            width: 8px; height: 8px; background: #f44336; border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .typing-indicator {
            display: flex; gap: 0.25rem; padding: 0.5rem;
        }
        .typing-dot {
            width: 6px; height: 6px; background: rgba(255,255,255,0.5);
            border-radius: 50%; animation: typing 1.4s infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-5px); } }
    </style>
</head>
<body>
    <div class="vintage-overlay"></div>
    
    <header class="py-4">
        <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center position-relative">
            <div class="logo">
                <img src="/static/logo.svg" alt="HEAT Logo" width="60" height="60" class="me-2">
                <div>HEAT<span>Pedal to the Metal</span></div>
            </div>
            <div class="racing-stripes"></div>
            <nav class="mt-3 mt-md-0 d-flex align-items-center gap-4">
                <ul class="mb-0 d-flex gap-3 list-unstyled">
                    <li><a href="/" class="text-uppercase"><i class="fa-solid fa-house me-2"></i>Home</a></li>
                    <li><a href="/stats.html" class="text-uppercase"><i class="fa-solid fa-chart-line me-2"></i>Statistics</a></li>
                    <li><a href="/trophies.html" class="text-uppercase"><i class="fa-solid fa-trophy me-2"></i>Trophies</a></li>
                    <li><a href="/controller.html" class="text-uppercase"><i class="fa-solid fa-mobile-screen me-2"></i>Controller</a></li>
                    <li><a href="/chat.html" class="active text-uppercase"><i class="fa-solid fa-comments me-2"></i>Chat</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container my-5">
        <div class="row">
            <div class="col-lg-3 mb-4">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-transparent">
                        <div class="live-indicator">
                            <span class="live-dot"></span>
                            <small>LIVE</small>
                        </div>
                    </div>
                    <div class="card-body p-0">
                        <div class="list-group list-group-flush">
                            <a href="#" class="list-group-item list-group-item-action active bg-transparent border-0">
                                <i class="fa-solid fa-tv me-2"></i>Race Feed
                            </a>
                            <a href="#" class="list-group-item list-group-item-action bg-transparent border-0">
                                <i class="fa-solid fa-users me-2"></i>Drivers Chat
                            </a>
                            <a href="#" class="list-group-item list-group-item-action bg-transparent border-0">
                                <i class="fa-solid fa-comment-caps me-2"></i>Fan Zone
                            </a>
                        </div>
                    </div>
                </div>
                
                <div class="card border-0 shadow-sm mt-4">
                    <div class="card-header bg-transparent">
                        <h6 class="mb-0"><i class="fa-solid fa-users me-2"></i>Online Users</h6>
                    </div>
                    <div class="card-body p-0">
                        <div id="online-users" class="small"></div>
                    </div>
                </div>
            </div>
            
            <div class="col-lg-9">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-transparent d-flex justify-content-between align-items-center">
                        <h5 class="mb-0"><i class="fa-solid fa-headset me-2"></i>Live Commentary</h5>
                        <span class="badge bg-danger" id="viewer-count">0 viewers</span>
                    </div>
                    <div class="chat-container">
                        <div class="chat-messages" id="chat-messages">
                            <div class="message message-system">
                                <i class="fa-solid fa-volume-high me-2"></i>
                                Welcome to the live race commentary feed!
                            </div>
                            <div class="typing-indicator" id="typing-indicator" style="display: none;">
                                <span class="typing-dot"></span>
                                <span class="typing-dot"></span>
                                <span class="typing-dot"></span>
                            </div>
                        </div>
                        <div class="chat-input-area">
                            <div class="input-group">
                                <input type="text" id="chat-input" class="form-control" 
                                       placeholder="Type your message..." maxlength="200">
                                <button class="btn btn-primary" onclick="sendMessage()">
                                    <i class="fa-solid fa-paper-plane"></i>
                                </button>
                                <button class="btn btn-outline-secondary" onclick="toggleEmoji()">
                                    <i class="fa-solid fa-face-smile"></i>
                                </button>
                            </div>
                            <div class="d-flex justify-content-between mt-2">
                                <small class="opacity-50">Press Enter to send</small>
                                <small class="opacity-50"><span id="char-count">0</span>/200</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="py-5 mt-5">
        <div class="container text-center">
            <p class="mb-0 text-uppercase fw-bold"><i class="fa-solid fa-flag-checkered mx-2"></i> 2026 Heat Racing Federation <i class="fa-solid fa-flag-checkered mx-2"></i></p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="/static/js/chat.js"></script>
</body>
</html>
