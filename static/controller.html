<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEAT: Race Controller</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { 
            touch-action: manipulation; 
            padding-bottom: 80px;
            font-size: 18px;
            background-color: var(--background);
            color: var(--text-main);
        }
        .controller-card {
            background: var(--surface);
            border: var(--border-width) solid var(--border-color);
            border-radius: 16px;
            padding: 1.25rem;
            margin-bottom: 1.25rem;
            box-shadow: 0 4px 12px var(--card-shadow);
        }
        .header {
            background: var(--surface);
            border-bottom: var(--border-width) solid var(--border-color);
        }
        .driver-row {
            display: flex;
            align-items: center;
            padding: 1rem;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            margin-bottom: 0.75rem;
        }
        .driver-row.active {
            background: rgba(76, 175, 80, 0.2);
            border: 2px solid #4caf50;
        }
        .position-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.5rem;
            flex-shrink: 0;
        }
        .action-btn {
            width: 100%;
            padding: 1.25rem;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 16px;
            margin-bottom: 0.75rem;
        }
        .race-control-btn {
            padding: 2rem;
            font-size: 2rem;
            border-radius: 50%;
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .status-indicator {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: inline-block;
        }
        .status-indicator.racing { background: #4caf50; animation: pulse 1s infinite; }
        .status-indicator.ready { background: #ff9800; }
        .status-indicator.stopped { background: #f44336; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .header-title {
            font-size: 1.5rem;
        }
        .race-stat {
            text-align: center;
            padding: 1rem;
        }
        .race-stat .label {
            font-size: 0.9rem;
            opacity: 0.7;
        }
        .race-stat .value {
            font-size: 2rem;
            font-weight: bold;
        }
        select.form-select, input.form-control {
            padding: 0.75rem;
            font-size: 1.1rem;
            background: var(--surface);
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }
        .quick-action-btn {
            padding: 1rem;
            font-size: 1.2rem;
        }
        .navbar {
            background: var(--surface) !important;
            border-top: var(--border-width) solid var(--border-color);
        }
        .navbar a {
            color: var(--text-main) !important;
        }
        .form-select:focus, .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(212, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <div class="vintage-overlay"></div>
    
    <header class="py-4 px-3">
        <div class="d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center">
                <img src="/static/logo.svg" alt="HEAT" width="56" height="56" class="me-3">
                <div>
                    <div class="fw-bold header-title">HEAT Controller</div>
                    <small class="opacity-75">Race Control</small>
                </div>
            </div>
            <div class="d-flex align-items-center gap-3">
                <span class="status-indicator stopped" id="status-dot" style="width:20px;height:20px;"></span>
                <span id="race-status" class="fw-bold" style="font-size:1.1rem;">STOPPED</span>
            </div>
        </div>
    </header>

    <main class="container-fluid px-3">
        <div class="row g-4">
            <div class="col-12">
                <div class="controller-card">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h4 class="mb-0"><i class="fa-solid fa-car-side me-2"></i>Race Control</h4>
                        <select id="race-type" class="form-select w-auto" style="font-size:1.1rem;padding:0.5rem;">
                            <option value="season">Season Race</option>
                            <option value="oneoff">One-Off Race</option>
                        </select>
                    </div>
                    <div class="d-flex justify-content-center gap-3 mb-3">
                        <button class="btn btn-success race-control-btn" onclick="startRace()">
                            <i class="fa-solid fa-play"></i>
                        </button>
                        <button class="btn btn-warning race-control-btn" onclick="pauseRace()">
                            <i class="fa-solid fa-pause"></i>
                        </button>
                        <button class="btn btn-danger race-control-btn" onclick="stopRace()">
                            <i class="fa-solid fa-stop"></i>
                        </button>
                    </div>
                    <div class="row text-center mt-4">
                        <div class="col-4 race-stat">
                            <div class="label">LAP</div>
                            <div class="value" id="current-lap">0</div>
                        </div>
                        <div class="col-4 race-stat">
                            <div class="label">TIME</div>
                            <div class="value" id="race-timer">00:00</div>
                        </div>
                        <div class="col-4 race-stat">
                            <div class="label">STATUS</div>
                            <div class="value" style="font-size:1.2rem;" id="race-state">READY</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12">
                <div class="controller-card">
                    <h4 class="mb-4"><i class="fa-solid fa-sliders me-2"></i>Live Standings</h4>
                    <div id="standings-list"></div>
                </div>
            </div>

            <div class="col-12">
                <div class="controller-card">
                    <h4 class="mb-4"><i class="fa-solid fa-gear me-2"></i>Quick Actions</h4>
                    <div class="row g-3">
                        <div class="col-6">
                            <button class="btn btn-primary w-100 quick-action-btn" onclick="shuffleGrid()">
                                <i class="fa-solid fa-shuffle me-2"></i>Shuffle
                            </button>
                        </div>
                        <div class="col-6">
                            <button class="btn btn-dark-blue w-100 quick-action-btn" onclick="triggerYellowFlag()">
                                <i class="fa-solid fa-flag me-2"></i>Yellow
                            </button>
                        </div>
                        <div class="col-6">
                            <button class="btn btn-warning w-100 quick-action-btn" id="safety-btn" onclick="toggleSafetyCar(this)">
                                <i class="fa-solid fa-car-side me-2"></i>Safety
                            </button>
                        </div>
                        <div class="col-6">
                            <button class="btn btn-danger w-100 quick-action-btn" id="redflag-btn" onclick="toggleRedFlag(this)">
                                <i class="fa-solid fa-circle-exclamation me-2"></i>Red Flag
                            </button>
                        </div>
                    <div class="col-12">
                        <button class="btn btn-outline-light w-100 quick-action-btn" onclick="triggerChequeredFlag()">
                            <i class="fa-solid fa-flag-checkered me-2"></i>Chequered Flag
                        </button>
                    </div>
                    <div class="col-12">
                        <button class="btn btn-success w-100 quick-action-btn" onclick="takeRoundSnapshot()">
                            <i class="fa-solid fa-camera me-2"></i>Take Round Snapshot
                        </button>
                    </div>
                    </div>
                    <hr class="my-3">
                    <h5 class="mb-3"><i class="fa-solid fa-flag me-2"></i>Driver Flags</h5>
                    <div class="row g-2 align-items-center">
                        <div class="col-7">
                            <select class="form-select" id="flag-driver-select">
                                <option value="">Select driver...</option>
                            </select>
                        </div>
                        <div class="col-5 d-flex gap-2">
                            <button class="btn btn-dark-blue flex-fill quick-action-btn py-2" onclick="sendBlueFlag()" title="Blue Flag - let faster car through">
                                <i class="fa-solid fa-flag"></i>
                            </button>
                            <button class="btn btn-secondary flex-fill quick-action-btn py-2" onclick="sendBlackWhiteFlag()" title="Black & White Flag - unsportsmanlike conduct">
                                <i class="fa-solid fa-flag-checkered"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12">
                <div class="controller-card">
                    <h5 class="mb-3"><i class="fa-solid fa-flag me-2"></i>Race Settings</h5>
                    <select id="track-select" class="form-select mb-3">
                        <option value="">Select Track</option>
                    </select>
                    <input type="text" id="race-name" class="form-control mb-3" placeholder="Race Name (optional)">
                    <input type="number" id="race-laps" class="form-control mb-3" placeholder="Number of Laps" value="53">
                    <button class="btn btn-outline-light action-btn" onclick="saveRaceSettings()">
                        <i class="fa-solid fa-save me-2"></i>Save Race Settings
                    </button>
                </div>
            </div>

            <div class="col-12 mb-5">
                <div class="controller-card">
                    <h5 class="mb-3"><i class="fa-solid fa-bookmark me-2"></i>Season</h5>
                    <div class="d-grid gap-2">
                        <button class="btn btn-success action-btn" onclick="saveRaceResult()">
                            <i class="fa-solid fa-trophy me-2"></i>Save to History
                        </button>
                        <button class="btn btn-warning action-btn" onclick="archiveCurrentSeason()">
                            <i class="fa-solid fa-box-archive me-2"></i>Archive Season
                        </button>
                        <button class="btn btn-outline-danger action-btn" onclick="discardRace()">
                            <i class="fa-solid fa-trash me-2"></i>Discard Race
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <nav class="navbar fixed-bottom navbar-dark bg-dark py-2">
        <div class="container-fluid d-flex justify-content-around">
            <a href="/" class="text-white text-center text-decoration-none">
                <i class="fa-solid fa-house d-block"></i>
                <small>Home</small>
            </a>
            <a href="/stats.html" class="text-white text-center text-decoration-none">
                <i class="fa-solid fa-chart-line d-block"></i>
                <small>Stats</small>
            </a>
            <a href="/trophies.html" class="text-white text-center text-decoration-none">
                <i class="fa-solid fa-trophy d-block"></i>
                <small>Trophies</small>
            </a>
        </div>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/controller.js"></script>
</body>
</html>
