<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEAT: Race Controller</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { touch-action: manipulation; }
        .controller-card {
            background: var(--card-bg, #1a1a2e);
            border: 1px solid var(--border-color, #333);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1rem;
        }
        .driver-row {
            display: flex;
            align-items: center;
            padding: 0.75rem;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            margin-bottom: 0.5rem;
        }
        .driver-row.active {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid #4caf50;
        }
        .position-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
        }
        .action-btn {
            width: 100%;
            padding: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 12px;
        }
        .race-control-btn {
            padding: 1.5rem;
            font-size: 1.5rem;
            border-radius: 50%;
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }
        .status-indicator.racing { background: #4caf50; animation: pulse 1s infinite; }
        .status-indicator.ready { background: #ff9800; }
        .status-indicator.stopped { background: #f44336; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="vintage-overlay"></div>
    
    <header class="py-3 px-3">
        <div class="d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center">
                <img src="/static/logo.svg" alt="HEAT" width="40" height="40" class="me-2">
                <div>
                    <div class="fw-bold">HEAT Controller</div>
                    <small class="opacity-50">Race Control</small>
                </div>
            </div>
            <div class="d-flex align-items-center gap-2">
                <span class="status-indicator stopped" id="status-dot"></span>
                <span id="race-status" class="small">STOPPED</span>
            </div>
        </div>
    </header>

    <main class="container-fluid px-3">
        <div class="row g-3">
            <div class="col-12">
                <div class="controller-card">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="mb-0"><i class="fa-solid fa-car-side me-2"></i>Race Control</h5>
                        <select id="race-type" class="form-select form-select-sm w-auto">
                            <option value="season">Season Race</option>
                            <option value="oneoff">One-Off Race</option>
                        </select>
                    </div>
                    <div class="d-flex justify-content-center gap-3 mb-3">
                        <button class="btn btn-success race-control-btn" onclick="startRace()">
                            <i class="fa-solid fa-play"></i>
                        </button>
                        <button class="btn btn-warning race-control-btn" onclick="pauseRace()">
                            <i class="fa-solid fa-pause"></i>
                        </button>
                        <button class="btn btn-danger race-control-btn" onclick="stopRace()">
                            <i class="fa-solid fa-stop"></i>
                        </button>
                    </div>
                    <div class="row text-center">
                        <div class="col-4">
                            <div class="small opacity-50">LAP</div>
                            <div class="h3" id="current-lap">0</div>
                        </div>
                        <div class="col-4">
                            <div class="small opacity-50">TIME</div>
                            <div class="h3" id="race-timer">00:00</div>
                        </div>
                        <div class="col-4">
                            <div class="small opacity-50">STATUS</div>
                            <div class="h6" id="race-state">READY</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12">
                <div class="controller-card">
                    <h5 class="mb-3"><i class="fa-solid fa-sliders me-2"></i>Live Standings</h5>
                    <div id="standings-list"></div>
                </div>
            </div>

            <div class="col-12">
                <div class="controller-card">
                    <h5 class="mb-3"><i class="fa-solid fa-gear me-2"></i>Quick Actions</h5>
                    <div class="d-grid gap-2">
                        <button class="btn btn-primary action-btn" onclick="shuffleGrid()">
                            <i class="fa-solid fa-shuffle me-2"></i>Shuffle Grid
                        </button>
                        <button class="btn btn-info action-btn" onclick="triggerYellowFlag()">
                            <i class="fa-solid fa-flag me-2"></i>Yellow Flag
                        </button>
                        <button class="btn btn-warning action-btn" onclick="triggerSafetyCar()">
                            <i class="fa-solid fa-car me-2"></i>Safety Car
                        </button>
                        <button class="btn btn-danger action-btn" onclick="triggerChequeredFlag()">
                            <i class="fa-solid fa-flag-checkered me-2"></i>Chequered Flag
                        </button>
                    </div>
                </div>
            </div>

            <div class="col-12">
                <div class="controller-card">
                    <h5 class="mb-3"><i class="fa-solid fa-comment-dots me-2"></i>Commentary</h5>
                    <div class="input-group">
                        <input type="text" id="commentary-input" class="form-control" placeholder="Type commentary...">
                        <button class="btn btn-primary" onclick="sendCommentary()">
                            <i class="fa-solid fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="col-12">
                <div class="controller-card">
                    <h5 class="mb-3"><i class="fa-solid fa-flag me-2"></i>Race Settings</h5>
                    <select id="track-select" class="form-select mb-3">
                        <option value="">Select Track</option>
                    </select>
                    <input type="text" id="race-name" class="form-control mb-3" placeholder="Race Name (optional)">
                    <input type="number" id="race-laps" class="form-control mb-3" placeholder="Number of Laps" value="53">
                    <button class="btn btn-outline-light action-btn" onclick="saveRaceSettings()">
                        <i class="fa-solid fa-save me-2"></i>Save Race Settings
                    </button>
                </div>
            </div>

            <div class="col-12 mb-5">
                <div class="controller-card">
                    <h5 class="mb-3"><i class="fa-solid fa-bookmark me-2"></i>Save Race</h5>
                    <div class="d-grid gap-2">
                        <button class="btn btn-success action-btn" onclick="saveRaceResult()">
                            <i class="fa-solid fa-trophy me-2"></i>Save to History
                        </button>
                        <button class="btn btn-outline-danger action-btn" onclick="discardRace()">
                            <i class="fa-solid fa-trash me-2"></i>Discard Race
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <nav class="navbar fixed-bottom navbar-dark bg-dark py-2">
        <div class="container-fluid d-flex justify-content-around">
            <a href="/" class="text-white text-center text-decoration-none">
                <i class="fa-solid fa-house d-block"></i>
                <small>Home</small>
            </a>
            <a href="/stats.html" class="text-white text-center text-decoration-none">
                <i class="fa-solid fa-chart-line d-block"></i>
                <small>Stats</small>
            </a>
            <a href="/trophies.html" class="text-white text-center text-decoration-none">
                <i class="fa-solid fa-trophy d-block"></i>
                <small>Trophies</small>
            </a>
            <a href="/chat.html" class="text-white text-center text-decoration-none">
                <i class="fa-solid fa-comments d-block"></i>
                <small>Chat</small>
            </a>
        </div>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let raceState = 'stopped';
        let raceTimer = null;
        let raceSeconds = 0;
        let racers = [];
        let currentLap = 0;

        async function loadData() {
            const [racersRes, tracksRes] = await Promise.all([
                fetch('/api/racers'),
                fetch('/api/tracks')
            ]);
            
            racers = await racersRes.json();
            const tracks = await tracksRes.json();
            
            renderStandings();
            
            const trackSelect = document.getElementById('track-select');
            tracks.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t.id;
                opt.textContent = `${t.country} - ${t.name}`;
                trackSelect.appendChild(opt);
            });
        }

        function renderStandings() {
            const sorted = [...racers].sort((a, b) => a.position - b.position);
            document.getElementById('standings-list').innerHTML = sorted.map((r, i) => `
                <div class="driver-row ${i === 0 ? 'active' : ''}">
                    <div class="position-btn btn ${r.position === 1 ? 'btn-warning' : r.position <= 3 ? 'btn-secondary' : 'btn-outline-light'} me-2">
                        ${r.position}
                    </div>
                    <img src="${r.profile_picture}" class="rounded-circle me-2" width="32" height="32" onerror="this.style.display='none'">
                    <div class="flex-grow-1">
                        <div class="fw-bold small">${r.name}</div>
                        <small class="opacity-50">${r.car_name}</small>
                    </div>
                    <button class="btn btn-sm btn-outline-secondary" onclick="moveUp(${r.id})">
                        <i class="fa-solid fa-chevron-up"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-secondary ms-1" onclick="moveDown(${r.id})">
                        <i class="fa-solid fa-chevron-down"></i>
                    </button>
                </div>
            `).join('');
        }

        function startRace() {
            if (raceState === 'stopped') {
                raceState = 'racing';
                raceSeconds = 0;
                currentLap = 1;
                updateStatus();
                raceTimer = setInterval(() => {
                    raceSeconds++;
                    const mins = Math.floor(raceSeconds / 60);
                    const secs = raceSeconds % 60;
                    document.getElementById('race-timer').textContent = 
                        `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                }, 1000);
            }
        }

        function pauseRace() {
            if (raceState === 'racing') {
                raceState = 'paused';
                clearInterval(raceTimer);
                updateStatus();
            } else if (raceState === 'paused') {
                raceState = 'racing';
                raceTimer = setInterval(() => {
                    raceSeconds++;
                    const mins = Math.floor(raceSeconds / 60);
                    const secs = raceSeconds % 60;
                    document.getElementById('race-timer').textContent = 
                        `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                }, 1000);
                updateStatus();
            }
        }

        function stopRace() {
            raceState = 'stopped';
            clearInterval(raceTimer);
            raceTimer = null;
            currentLap = 0;
            updateStatus();
        }

        function updateStatus() {
            const dot = document.getElementById('status-dot');
            const status = document.getElementById('race-status');
            const state = document.getElementById('race-state');
            
            dot.className = 'status-indicator';
            
            switch (raceState) {
                case 'racing':
                    dot.classList.add('racing');
                    status.textContent = 'RACING';
                    state.textContent = 'GREEN FLAG';
                    break;
                case 'paused':
                    dot.classList.add('ready');
                    status.textContent = 'PAUSED';
                    state.textContent = 'YELLOW FLAG';
                    break;
                default:
                    dot.classList.add('stopped');
                    status.textContent = 'STOPPED';
                    state.textContent = 'READY';
            }
            
            document.getElementById('current-lap').textContent = currentLap;
        }

        function shuffleGrid() {
            const shuffled = [...racers].sort(() => Math.random() - 0.5);
            shuffled.forEach((r, i) => {
                r.rank = i + 1;
                r.position = 100 - i;
            });
            
            fetch('/api/racers', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(racers)
            }).then(() => renderStandings());
        }

        function moveUp(id) {
            const r = racers.find(r => r.id === id);
            if (r && r.position > 1) {
                r.position--;
                const other = racers.find(r => r.position === r.position);
                if (other) other.position++;
                savePositions();
            }
        }

        function moveDown(id) {
            const r = racers.find(r => r.id === id);
            if (r) {
                r.position++;
                const other = racers.find(r => r.position === r.position);
                if (other) other.position--;
                savePositions();
            }
        }

        function savePositions() {
            fetch('/api/racers', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(racers)
            }).then(() => renderStandings());
        }

        function triggerYellowFlag() {
            broadcastMessage({ type: 'flag', flag: 'yellow' });
        }

        function triggerSafetyCar() {
            broadcastMessage({ type: 'flag', flag: 'safety' });
        }

        function triggerChequeredFlag() {
            broadcastMessage({ type: 'flag', flag: 'chequered' });
        }

        function sendCommentary() {
            const input = document.getElementById('commentary-input');
            if (input.value.trim()) {
                broadcastMessage({ type: 'commentary', text: input.value.trim() });
                input.value = '';
            }
        }

        function saveRaceSettings() {
            const track = document.getElementById('track-select').value;
            const laps = parseInt(document.getElementById('race-laps').value) || 53;
            const name = document.getElementById('race-name').value;
            
            fetch('/api/race-info', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    track_id: track || 'monza',
                    laps: laps,
                    name: name,
                    is_oneoff: document.getElementById('race-type').value === 'oneoff'
                })
            });
        }

        function saveRaceResult() {
            const raceType = document.getElementById('race-type').value;
            const results = racers.map(r => ({
                racer_id: r.id,
                racer_name: r.name,
                position: r.position,
                points: getPointsForPosition(r.position),
                fastestLap: r.position === 1,
                finished: true
            }));
            
            fetch('/api/race-history', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: document.getElementById('race-name').value || `Race ${new Date().toLocaleDateString()}`,
                    race_date: new Date().toISOString().split('T')[0],
                    country: document.getElementById('track-select').selectedOptions[0]?.text?.split(' - ')[0] || 'Unknown',
                    track: document.getElementById('track-select').selectedOptions[0]?.text?.split(' - ')[1] || 'Unknown',
                    track_id: document.getElementById('track-select').value || 'monza',
                    total_laps: parseInt(document.getElementById('race-laps').value) || 53,
                    race_type: raceType,
                    results: results
                })
            }).then(() => {
                alert('Race saved to history!');
                stopRace();
            });
        }

        function discardRace() {
            if (confirm('Discard this race? All progress will be lost.')) {
                stopRace();
            }
        }

        function getPointsForPosition(pos) {
            const points = [25, 18, 15, 12, 10, 8, 6, 4, 2, 1];
            return points[pos - 1] || 0;
        }

        function broadcastMessage(msg) {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const ws = new WebSocket(`${protocol}//${window.location.host}/ws`);
            ws.onopen = () => ws.send(JSON.stringify(msg));
        }

        document.getElementById('commentary-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendCommentary();
        });

        loadData();
    </script>
</body>
</html>
