<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#d40000">
    <title>My Stats - HEAT Racing</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <style>
        :root { --heat-red: #d40000; --heat-dark: #111; }
        body { background: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .stats-card { background: white; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); max-width: 500px; width: 100%; overflow: hidden; }
        .driver-header { background: linear-gradient(135deg, var(--heat-dark), #333); color: white; padding: 2rem; text-align: center; }
        .driver-header img { width: 96px; height: 96px; border-radius: 50%; border: 4px solid var(--heat-red); object-fit: cover; }
        .driver-header h2 { margin-top: 1rem; font-weight: 700; }
        .stat-item { padding: 1rem 1.5rem; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .stat-item:last-child { border-bottom: none; }
        .stat-label { color: #666; font-weight: 600; font-size: 0.9rem; }
        .stat-value { font-weight: 700; font-size: 1.1rem; color: var(--heat-dark); }
        .stat-value.gold { color: #d4a017; }
        .stat-value.silver { color: #8a8a8a; }
        .stat-value.bronze { color: #cd7f32; }
        .error-card { text-align: center; padding: 3rem; }
        .loading { text-align: center; padding: 3rem; }
        .badge-stat { display: inline-block; padding: 0.35em 0.65em; border-radius: 50px; font-weight: 700; font-size: 0.85rem; }
        .version-footer { text-align: center; padding: 1rem; color: #999; font-size: 0.75rem; }
    </style>
</head>
<body>
    <div class="container py-4">
        <div id="driver-content">
            <div class="stats-card mx-auto loading" id="loading-state">
                <div class="p-5">
                    <div class="text-center">
                        <div class="spinner-border text-danger mb-3" role="status" style="width: 3rem; height: 3rem;"></div>
                        <p class="text-muted">Loading your stats...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/driver.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
</body>
</html>
