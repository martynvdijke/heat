<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#d40000">
    <title>My Profile - HEAT Racing</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <style>
        :root { --heat-red: #d40000; --heat-dark: #111; }
        body { background: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .profile-card { background: white; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); overflow: hidden; }
        .driver-header { background: linear-gradient(135deg, var(--heat-dark), #333); color: white; padding: 1.5rem; display: flex; align-items: center; gap: 1rem; }
        .driver-header img { width: 72px; height: 72px; border-radius: 50%; border: 4px solid var(--heat-red); object-fit: cover; }
        .stat-value.gold { color: #d4a017; } .stat-value.silver { color: #8a8a8a; } .stat-value.bronze { color: #cd7f32; }
        .section-title { color: #666; font-weight: 700; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.05em; }
        .version-footer { text-align: center; padding: 1rem; color: #999; font-size: 0.75rem; }
        .colored-dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; }
    </style>
</head>
<body>
    <div class="container py-4">
        <div id="me-content">
            <div class="text-center py-5"><div class="spinner-border text-danger" role="status"></div></div>
        </div>
    </div>
    <script src="/static/js/me.js"></script>
</body>
</html>
