<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#d40000">
    <title>HEAT: Pit Board</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <script>if(localStorage.getItem('theme')==='dark'||(!localStorage.getItem('theme')&&window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.setAttribute('data-theme','dark');}</script>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">

</head>
<body data-page="pitboard">
    <button class="fullscreen-btn" onclick="pitToggleFullscreen()">
        <i aria-hidden="true" class="fa-solid fa-expand me-1"></i>Fullscreen
    </button>

    <div class="pit-header">
        <div>
            <h1>PIT BOARD</h1>
            <small id="pit-race-name" class="opacity-75">Loading race...</small>
        </div>
        <div class="race-meta">
            <div id="pit-lap" style="font-family:'Bebas Neue',sans-serif;font-size:2rem;">Lap 0</div>
            <small id="pit-clock">--:--</small>
        </div>
    </div>

    <div class="pit-board" id="pit-board">
        <div class="text-center py-5" style="grid-column:1/-1;">Loading driver data...</div>
    </div>

    <div class="pit-footer">
        <div class="pit-weather">
            <span id="pit-weather-icon">☀️</span>
            <span id="pit-weather-text">Dry</span>
        </div>
        <div id="pit-flag-status">🏁 Green Flag</div>
    </div>

    <script src="/static/js/pitboard.js"></script>
</body>
</html>
