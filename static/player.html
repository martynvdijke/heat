<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#d40000">
    <title>HEAT: Player Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">

</head>
<body data-page="player">
    <div class="vintage-overlay"></div>

    <!-- Login Screen -->
    <div id="login-screen" class="container-fluid px-3" style="padding-top: 40vh;">
        <div class="text-center mb-4">
            <img src="/static/logo.svg" alt="HEAT" width="80" height="80">
            <h1 class="mt-3" style="font-family:'Bebas Neue',sans-serif;">Player Login</h1>
        </div>
        <div class="card">
            <label for="player-select" class="visually-hidden">Select your driver</label>
            <select id="player-select" class="form-select mb-3">
                <option value="">Select your driver...</option>
            </select>
            <label for="device-name" class="visually-hidden">Device Name</label>
            <input type="text" id="device-name" class="form-control mb-3" placeholder="Device Name (e.g. iPhone)" value="Phone">
            <button class="btn btn-primary w-100 action-btn" onclick="playerLogin()">
                <i aria-hidden="true" class="fa-solid fa-right-to-bracket me-2"></i>Connect
            </button>
            <p class="text-center mt-3 mb-0 small opacity-50">
                <i aria-hidden="true" class="fa-solid fa-shield-halved me-1"></i>Your device gets a private token
            </p>
        </div>
    </div>

    <!-- Player Dashboard -->
    <div id="dashboard-screen" style="display:none;">
        <div class="header-bar d-flex justify-content-between align-items-center">
            <div>
                <div class="d-flex align-items-center">
                    <span class="driver-color-dot" id="my-color"></span>
                    <span class="fw-bold ms-2" id="my-name" style="font-size:1.2rem;"></span>
                </div>
                <small class="opacity-50">Lap <span id="my-lap">0</span> &middot; Pos <span id="my-pos">0</span></small>
            </div>
            <button class="btn btn-outline-danger btn-sm" onclick="playerLogout()" aria-label="Logout">
                <i aria-hidden="true" class="fa-solid fa-right-from-bracket"></i>
            </button>
        </div>

        <div class="container-fluid px-3 mt-3">
            <!-- Heat Cards -->
            <div class="card">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h5 class="mb-0"><i aria-hidden="true" class="fa-solid fa-fire me-2" style="color:#e74c3c;"></i>Heat Cards</h5>
                    <div class="d-flex gap-2">
                        <span class="badge bg-secondary">Hand: <span id="hand-count">0</span></span>
                        <span class="badge bg-dark">Deck: <span id="deck-count">0</span></span>
                        <span class="badge bg-secondary">Discard: <span id="discard-count">0</span></span>
                        <span class="badge bg-danger">Engine: <span id="engine-count">0</span></span>
                    </div>
                </div>
                <div class="mb-2">
                    <small class="opacity-50">Hand</small>
                    <div id="hand-cards" class="d-flex flex-wrap"></div>
                </div>
                <div class="action-grid mt-2">
                    <button class="btn btn-outline-danger action-btn" onclick="addHeatToEngine()">
                        <i aria-hidden="true" class="fa-solid fa-fire me-1"></i>+1 Heat
                    </button>
                    <button class="btn btn-outline-warning action-btn" onclick="addStress()">
                        <i aria-hidden="true" class="fa-solid fa-bolt me-1"></i>+1 Stress
                    </button>
                    <button class="btn btn-outline-success action-btn" onclick="discardHeat()">
                        <i aria-hidden="true" class="fa-solid fa-arrow-right me-1"></i>Discard 1
                    </button>
                    <button class="btn btn-outline-info action-btn" onclick="drawCard()">
                        <i aria-hidden="true" class="fa-solid fa-hand me-1"></i>Draw 1
                    </button>
                </div>
            </div>

            <!-- Gear & Stress -->
            <div class="card">
                <h5 class="mb-3"><i aria-hidden="true" class="fa-solid fa-gear me-2"></i>Gear Shift</h5>
                <div class="text-center">
                    <div id="gear-selector" class="mb-3">
                        <button class="btn btn-outline-light gear-btn" data-gear="1" onclick="reportGear(1)">1</button>
                        <button class="btn btn-outline-light gear-btn" data-gear="2" onclick="reportGear(2)">2</button>
                        <button class="btn btn-outline-light gear-btn" data-gear="3" onclick="reportGear(3)">3</button>
                        <button class="btn btn-outline-light gear-btn" data-gear="4" onclick="reportGear(4)">4</button>
                    </div>
                    <div class="row g-2">
                        <div class="col-6">
                            <button class="btn btn-outline-secondary w-100" onclick="reportStress(1)">
                                <i aria-hidden="true" class="fa-solid fa-bolt me-1"></i>+1 Stress
                            </button>
                        </div>
                        <div class="col-6">
                            <button class="btn btn-outline-secondary w-100" onclick="reportStress(2)">
                                <i aria-hidden="true" class="fa-solid fa-bolt me-1"></i>+2 Stress
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Turbo -->
            <div class="card">
                <div class="d-flex justify-content-between align-items-center">
                    <h5 class="mb-0"><i aria-hidden="true" class="fa-solid fa-gauge-high me-2" style="color:#2ecc71;"></i>Turbo</h5>
                    <span id="turbo-count" class="badge bg-success">Available</span>
                </div>
                <div class="text-center mt-3">
                    <button class="btn btn-success turbo-btn" id="turbo-btn" onclick="useTurbo()" aria-label="Use turbo">
                        <i aria-hidden="true" class="fa-solid fa-bolt"></i>
                    </button>
                    <p class="mt-2 small opacity-50">Tap to use turbo this lap</p>
                </div>
            </div>

            <!-- Lap History -->
            <div class="card">
                <h5 class="mb-3"><i aria-hidden="true" class="fa-solid fa-clock-rotate-left me-2"></i>My Laps</h5>
                <div id="my-lap-history" class="small">
                    <p class="text-center opacity-50">No laps recorded yet</p>
                </div>
            </div>

            <!-- Connection Status -->
            <div class="text-center mt-3 mb-5">
                <small class="opacity-50" id="connection-status">
                    <i aria-hidden="true" class="fa-solid fa-circle me-1" style="color:#4caf50;font-size:8px;"></i>Connected
                </small>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/player.js"></script>
</body>
</html>
