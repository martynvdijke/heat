<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#d40000">
    <title>Race Report - HEAT</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <style>
        :root { --heat-red: #d40000; --heat-dark: #111; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #fff;
            color: #222;
            padding: 2rem;
            max-width: 1000px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            border-bottom: 4px solid var(--heat-red);
            padding-bottom: 1.5rem;
            margin-bottom: 2rem;
        }
        .header h1 {
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--heat-dark);
        }
        .header .subtitle {
            font-size: 1rem;
            color: #666;
            margin-top: 0.5rem;
        }
        .race-info {
            display: flex;
            justify-content: center;
            gap: 2rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }
        .race-info span {
            background: #f5f5f5;
            padding: 0.5rem 1.5rem;
            border-radius: 6px;
        }
        .race-info strong { color: var(--heat-red); }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5rem 0;
        }
        th {
            background: var(--heat-dark);
            color: white;
            padding: 0.75rem 1rem;
            text-align: left;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }
        td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid #eee;
        }
        tr:nth-child(even) { background: #fafafa; }
        .pos-1 { background: #fff3cd !important; }
        .pos-2 { background: #f0f0f0 !important; }
        .pos-3 { background: #fdebd0 !important; }
        .fastest-lap { color: var(--heat-red); font-weight: bold; }
        .footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 1rem;
            border-top: 1px solid #ddd;
            color: #999;
            font-size: 0.85rem;
        }
        .no-data {
            text-align: center;
            padding: 3rem;
            color: #999;
        }
        @media print {
            body { padding: 0; }
            .no-print { display: none; }
        }
    </style>
</head>
<body>
    <div class="no-print" style="text-align:right;margin-bottom:1rem">
        <button onclick="window.print()" style="background:var(--heat-red);color:white;border:none;padding:0.75rem 2rem;border-radius:6px;cursor:pointer;font-size:1rem">
            Print / Save PDF
        </button>
        <a href="/" style="margin-left:1rem;color:var(--heat-red)">Back to Race</a>
    </div>

    <div id="loading" class="no-data">Loading race report...</div>
    <div id="report" style="display:none">
        <div class="header">
            <h1 id="race-name"></h1>
            <div class="subtitle">HEAT: Pedal to the Metal - Race Report</div>
        </div>
        <div class="race-info">
            <span><strong>Circuit:</strong> <span id="race-track"></span></span>
            <span><strong>Country:</strong> <span id="race-country"></span></span>
            <span><strong>Laps:</strong> <span id="race-laps"></span></span>
            <span><strong>Date:</strong> <span id="race-date"></span></span>
        </div>
        <h2 style="color:var(--heat-dark);margin-top:2rem">Final Classification</h2>
        <table>
            <thead>
                <tr>
                    <th>Pos</th>
                    <th>Driver</th>
                    <th>Points</th>
                    <th>Fastest Lap</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="results-body"></tbody>
        </table>
    </div>
    <div id="error" class="no-data" style="display:none;color:var(--heat-red)"></div>
    <div class="footer">Generated by HEAT Board Game Companion &mdash; v{{VERSION}}</div>

    <script>
        const raceId = new URLSearchParams(window.location.search).get('race_id');
        const container = document.getElementById('report');
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');

        fetch('/api/race-report' + (raceId ? '?race_id=' + raceId : ''))
            .then(function(r) {
                if (!r.ok) throw new Error('Race not found');
                return r.json();
            })
            .then(function(data) {
                loading.style.display = 'none';
                container.style.display = 'block';

                document.getElementById('race-name').textContent = data.name || 'Race';
                document.getElementById('race-track').textContent = data.track || '-';
                document.getElementById('race-country').textContent = data.country || '-';
                document.getElementById('race-laps').textContent = data.total_laps || '-';
                document.getElementById('race-date').textContent = data.race_date || '-';

                var tbody = document.getElementById('results-body');
                if (data.results && data.results.length > 0) {
                    data.results.forEach(function(r) {
                        var tr = document.createElement('tr');
                        var posClass = r.position <= 3 ? 'pos-' + r.position : '';
                        if (posClass) tr.className = posClass;
                        tr.innerHTML =
                            '<td><strong>#' + r.position + '</strong></td>' +
                            '<td>' + r.racer_name + '</td>' +
                            '<td>' + r.points + ' pts</td>' +
                            '<td class="' + (r.fastest_lap ? 'fastest-lap' : '') + '">' + (r.fastest_lap ? 'Yes' : '-') + '</td>' +
                            '<td>' + (r.finished !== false ? 'Finished' : (r.dns ? 'DNS' : 'DNF')) + '</td>';
                        tbody.appendChild(tr);
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="5" class="no-data">No results available</td></tr>';
                }
            })
            .catch(function(err) {
                loading.style.display = 'none';
                error.style.display = 'block';
                error.textContent = 'Error: ' + err.message;
            });
    </script>
</body>
</html>
