<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#d40000">
    <title>HEAT: Race Replay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">

</head>
<body data-page="replay">
    <div class="vintage-overlay"></div>
    <div class="replay-header">
        <div class="d-flex justify-content-between align-items-center">
            <h1 class="mb-0" style="font-family:'Bebas Neue',sans-serif;font-size:2rem;">
                <i aria-hidden="true" class="fa-solid fa-clock-rotate-left me-2"></i>Race Replay
            </h1>
            <a href="/" class="btn btn-outline-light btn-sm"><i aria-hidden="true" class="fa-solid fa-house"></i></a>
        </div>
    </div>

    <div class="container-fluid px-3 mt-3">
        <div class="replay-controls">
            <div class="row g-2 align-items-center">
                <div class="col-md-4">
                    <select class="form-select" id="replay-race-select">
                        <option value="">Select a race...</option>
                    </select>
                </div>
                <div class="col-md-8 d-flex gap-2">
                    <button class="btn btn-outline-info" onclick="replayPrevLap()"><i aria-hidden="true" class="fa-solid fa-backward-step"></i></button>
                    <button class="btn btn-success" id="replay-play-btn" onclick="toggleReplayPlay()"><i aria-hidden="true" class="fa-solid fa-play"></i></button>
                    <button class="btn btn-outline-info" onclick="replayNextLap()"><i aria-hidden="true" class="fa-solid fa-forward-step"></i></button>
                    <button class="btn btn-outline-warning" onclick="replayReset()"><i aria-hidden="true" class="fa-solid fa-rotate-left"></i></button>
                    <span class="ms-auto align-self-center fw-bold" id="replay-lap-display">Lap 0 / 0</span>
                </div>
            </div>
            <div class="replay-timeline" id="replay-timeline"></div>
        </div>

        <div class="row g-3">
            <div class="col-md-8">
                <div class="replay-table">
                    <h5 class="mb-3"><i aria-hidden="true" class="fa-solid fa-ranking-star me-2"></i>Positions</h5>
                    <div id="replay-positions">
                        <p class="text-center opacity-50">Select a race to begin</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="replay-stats">
                    <div class="replay-stat-card">
                        <div class="value" id="replay-avg-pos">-</div>
                        <div class="label">Avg Position</div>
                    </div>
                    <div class="replay-stat-card">
                        <div class="value" id="replay-most-overtakes">-</div>
                        <div class="label">Most Overtakes</div>
                    </div>
                    <div class="replay-stat-card">
                        <div class="value" id="replay-total-turbo">-</div>
                        <div class="label">Total Turbo Uses</div>
                    </div>
                    <div class="replay-stat-card">
                        <div class="value" id="replay-total-heat">-</div>
                        <div class="label">Total Heat</div>
                    </div>
                </div>
                <div class="replay-table mt-3">
                    <h5 class="mb-3"><i aria-hidden="true" class="fa-solid fa-list me-2"></i>Events</h5>
                    <div id="replay-events" style="max-height:200px;overflow-y:auto;">
                        <p class="text-center opacity-50">No events</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/replay.js"></script>
</body>
</html>
