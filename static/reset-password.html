<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#d40000">
    <title>HEAT Admin - Reset Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <style>
        body { background: #111; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: #1a1a1a; border: 1px solid #333; border-radius: 10px; padding: 40px; width: 100%; max-width: 400px; }
        .admin-header { background: #d40000; color: white; padding: 10px 20px; border-radius: 5px; margin-bottom: 30px; text-align: center; }
        .form-control { background: #2a2a2a; border: 1px solid #444; color: white; }
        .form-control:focus { background: #333; border-color: #d40000; color: white; }
        .btn-primary { background: #d40000; border-color: #d40000; }
        .btn-primary:hover { background: #b30000; border-color: #b30000; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="admin-header">
            <h4><i class="fa-solid fa-lock me-2" aria-hidden="true"></i>Reset Password</h4>
        </div>
        <div id="reset-form-wrap">
            <form id="reset-password-form">
                <div class="mb-3">
                    <label class="form-label text-white">New Password</label>
                    <input type="password" class="form-control" id="password" name="password" autocomplete="new-password" minlength="8" required placeholder="Minimum 8 characters">
                </div>
                <div class="mb-3">
                    <label class="form-label text-white">Confirm Password</label>
                    <input type="password" class="form-control" id="confirm-password" name="confirm_password" autocomplete="new-password" minlength="8" required placeholder="Repeat new password">
                </div>
                <div id="reset-error" class="alert alert-danger mt-3 d-none" role="alert"></div>
                <button type="submit" class="btn btn-primary w-100">Set New Password</button>
            </form>
        </div>
        <div id="reset-invalid" class="d-none">
            <div class="alert alert-danger" role="alert">
                This reset link is invalid or has expired.
            </div>
            <p class="text-center mb-0"><a href="/forgot-password.html" class="text-muted small">Request a new reset link</a></p>
        </div>
        <p class="text-center mt-3 mb-0"><a href="/login.html" class="text-muted small">Back to login</a></p>
    </div>
    <script src="/static/js/reset-password.js"></script>
</body>
</html>
