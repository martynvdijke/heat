<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#d40000">
    <title>HEAT: Seasons &amp; Rounds</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
</head>
<body>
    <div class="vintage-overlay"></div>
    
    <header class="py-3">
        <div class="container position-relative">
            <div class="d-flex justify-content-between align-items-center">
                <div class="logo">
                    <img src="/static/logo.svg" alt="HEAT Logo" width="60" height="60" class="me-2">
                    <div>HEAT<span>Pedal to the Metal</span></div>
                </div>
                <button class="navbar-toggler d-md-none" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>
            <div class="racing-stripes"></div>
            <div id="mainNav" class="collapse d-md-block">
                <nav class="mt-3 d-flex flex-wrap justify-content-center justify-content-md-end align-items-center gap-3">
                    <ul class="mb-0 d-flex flex-wrap gap-3 list-unstyled justify-content-center">
                        <li><a href="/" class="text-uppercase"><i aria-hidden="true" class="fa-solid fa-house me-2"></i>Home</a></li>
                        <li><a href="/seasons.html" class="active text-uppercase"><i aria-hidden="true" class="fa-solid fa-calendar-days me-2"></i>Seasons</a></li>
                        <li><a href="/stats.html" class="text-uppercase"><i aria-hidden="true" class="fa-solid fa-chart-line me-2"></i>Stats</a></li>
                        <li><a href="/trophies.html" class="text-uppercase"><i aria-hidden="true" class="fa-solid fa-trophy me-2"></i>Trophies</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <main class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <h1 class="mb-0"><i aria-hidden="true" class="fa-solid fa-calendar-days me-2"></i>Seasons &amp; Rounds</h1>
        </div>

        <div class="row g-4 mb-4" id="seasons-container">
            <div class="col-12 text-center text-muted py-5">
                <i aria-hidden="true" class="fa-solid fa-spinner fa-spin fa-2x mb-3"></i>
                <p>Loading seasons...</p>
            </div>
        </div>
    </main>

    <footer class="py-5 mt-5">
        <div class="container text-center">
            <p class="mb-0 text-uppercase fw-bold"><i aria-hidden="true" class="fa-solid fa-flag-checkered mx-2"></i> 2026 Heat Racing Federation <i aria-hidden="true" class="fa-solid fa-flag-checkered mx-2"></i></p>
            <span class="small opacity-50 text-uppercase letter-spacing-2 mt-2 d-block">Developed for legends. Driven by heat.</span>
            <span class="small opacity-50 text-uppercase letter-spacing-2 mt-2 d-block" id="version-display">v{{VERSION}}</span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/seasons.js"></script>
</body>
</html>
