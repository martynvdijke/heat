<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#d40000">
    <title>HEAT: Spectator View</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">

</head>
<body data-page="spectator">
    <div class="vintage-overlay"></div>
    <div class="spec-header">
        <div class="d-flex justify-content-between align-items-center">
            <h1 class="mb-0" style="font-family:'Bebas Neue',sans-serif;font-size:2rem;">
                <i aria-hidden="true" class="fa-solid fa-binoculars me-2"></i>Spectator View
            </h1>
            <div class="d-flex align-items-center gap-3">
                <span class="spec-status stopped" id="spec-status-indicator">READY</span>
                <a href="/" class="btn btn-outline-light btn-sm" aria-label="Home"><i aria-hidden="true" class="fa-solid fa-house"></i></a>
            </div>
        </div>
    </div>

    <div class="spec-race-info mt-3">
        <div class="row g-3 align-items-center">
            <div class="col-md-4">
                <h4 id="spec-race-name" class="mb-0">Race</h4>
                <small id="spec-race-track" class="opacity-50">Track</small>
            </div>
            <div class="col-md-4 text-center">
                <span style="font-family:'Bebas Neue',sans-serif;font-size:2rem;" id="spec-lap">Lap 0</span>
            </div>
            <div class="col-md-4 text-end">
                <span id="spec-weather">☀️ Dry</span>
                <span id="spec-weather-forecast" class="ms-2 small opacity-75" hidden></span>
                <span class="ms-3" id="spec-timer">00:00</span>
            </div>
        </div>
    </div>

    <div class="spec-grid" id="spec-grid" aria-live="polite">
        <p class="text-center opacity-50" style="grid-column:1/-1;">Loading race data...</p>
    </div>

    <div class="row g-3 px-3 mt-2">
        <div class="col-md-6">
            <div class="spec-race-info">
                <h5 class="mb-3"><i aria-hidden="true" class="fa-solid fa-comment-dots me-2"></i>Commentary</h5>
                <div class="spec-commentary" id="spec-commentary">
                    <p class="text-center opacity-50">No commentary yet</p>
                </div>
            </div>
            <div class="spec-race-info mt-3">
                <h5 class="mb-3"><i aria-hidden="true" class="fa-solid fa-list me-2"></i>Recent Events</h5>
                <div class="spec-events" id="spec-events" aria-live="polite">
                    <p class="text-center opacity-50">No events yet</p>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="spec-race-info">
                <h5 class="mb-3"><i aria-hidden="true" class="fa-solid fa-fire me-2"></i>Heat Usage</h5>
                <div id="spec-heat-chart" class="text-center opacity-50 py-3">Heat data available when players self-report</div>
            </div>
        </div>
    </div>

    <script src="/static/js/spectator.js"></script>
</body>
</html>
