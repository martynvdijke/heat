<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#d40000">
    <title>HEAT: Start Lights</title>
    <link rel="manifest" href="/static/manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0a0a;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .vintage-overlay { display: none; }

        /* === Header === */
        .sl-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px;
            text-align: center;
            z-index: 10;
        }
        .sl-header .logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2rem;
            color: #d40000;
            letter-spacing: 6px;
            opacity: 0.6;
        }

        /* === Status Bar === */
        #start-status-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 12px 20px;
            text-align: center;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1rem;
            letter-spacing: 3px;
            color: rgba(255,255,255,0.5);
            background: rgba(0,0,0,0.6);
            border-top: 1px solid rgba(255,255,255,0.1);
            z-index: 10;
        }

        /* === Light Container === */
        .start-lights-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            position: relative;
        }

        #start-lights {
            display: flex;
            gap: 30px;
            align-items: center;
            justify-content: center;
        }

        .start-light {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .start-light-bulb {
            width: clamp(80px, 15vw, 120px);
            height: clamp(80px, 15vw, 120px);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 4px solid rgba(255, 255, 255, 0.15);
            transition: background 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            position: relative;
        }

        .start-light-bulb::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60%;
            height: 60%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .start-light-bulb.red {
            background: radial-gradient(circle at 35% 35%, #ff4444, #cc0000 60%, #880000);
            border-color: #ff4444;
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.6), 0 0 80px rgba(255, 0, 0, 0.3);
        }

        .start-light-bulb.red::after {
            opacity: 1;
        }

        .start-light-bulb.green {
            background: radial-gradient(circle at 35% 35%, #44ff44, #00cc00 60%, #008800);
            border-color: #44ff44;
            box-shadow: 0 0 40px rgba(0, 255, 0, 0.6), 0 0 80px rgba(0, 255, 0, 0.3);
        }

        .start-light-bulb.green::after {
            opacity: 1;
        }

        .start-light-label {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 2px;
        }

        /* === Message === */
        .start-message-area {
            text-align: center;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #start-message {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(3rem, 8vw, 6rem);
            letter-spacing: 8px;
            line-height: 1.1;
            transition: all 0.3s ease;
        }

        #start-message:empty {
            display: none;
        }

        #start-submessage {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(1rem, 2vw, 1.4rem);
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 8px;
        }

        /* === Controls === */
        .sl-controls {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 8px;
            z-index: 20;
        }

        .sl-controls button {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            transition: background 0.2s;
        }

        .sl-controls button:hover {
            background: rgba(255,255,255,0.2);
        }

        /* === GO Animation === */
        @keyframes goPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .go-animate {
            animation: goPulse 0.4s ease-in-out 3;
            color: #44ff44;
        }

        /* === Reduced Motion === */
        @media (prefers-reduced-motion: reduce) {
            .start-light-bulb { transition: none; }
            .go-animate { animation: none; }
            .start-light-bulb.red { box-shadow: 0 0 10px rgba(255,0,0,0.3); }
            .start-light-bulb.green { box-shadow: 0 0 10px rgba(0,255,0,0.3); }
        }

        /* === Responsive === */
        @media (max-width: 600px) {
            #start-lights { gap: 12px; }
            .start-light-bulb { width: 60px; height: 60px; border-width: 3px; }
            .start-light-label { font-size: 0.9rem; }
        }
    </style>
</head>
<body data-page="startlights">
    <div class="sl-header">
        <div class="logo">HEAT START LIGHTS</div>
    </div>

    <div class="sl-controls">
        <button onclick="window.close()" aria-label="Close"><i aria-hidden="true" class="fa-solid fa-xmark me-1"></i>Close</button>
    </div>

    <div class="start-lights-container">
        <div class="start-message-area">
            <div id="start-message"></div>
            <div id="start-submessage"></div>
        </div>
        <div id="start-lights"></div>
    </div>

    <div id="start-status-bar">START LIGHTS • READY</div>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <script src="/static/js/startlights.js"></script>
</body>
</html>
