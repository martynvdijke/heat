{{define "adminFooter"}}
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="{{.VendorJS}}"></script>
    <script>
        document.body.addEventListener('htmx:beforeRequest', function(evt) {
            if (evt.detail.requestConfig && evt.detail.requestConfig.path.startsWith('/api/html/admin/')) {
                var container = document.getElementById('admin-tab-container');
                var tabId = evt.detail.requestConfig.path.split('/').pop();
                if (container && container.getAttribute('data-tab-mounted') === tabId) {
                    evt.preventDefault();
                    return;
                }
            }
        });
        document.body.addEventListener('htmx:beforeSend', function(evt) {
            if (evt.detail.requestConfig && evt.detail.requestConfig.path.startsWith('/api/html/admin/')) {
                var container = document.getElementById('admin-tab-container');
                if (container) container.innerHTML = '<div class="text-center py-5"><i class="fa-solid fa-spinner fa-spin fa-2x text-muted"></i><p class="mt-2 text-muted">Loading...</p></div>';
            }
        });
        document.body.addEventListener('htmx:afterOnLoad', function(evt) {
            if (evt.detail.requestConfig && evt.detail.requestConfig.path.startsWith('/api/html/admin/')) {
                var container = document.getElementById('admin-tab-container');
                var tabId = evt.detail.requestConfig.path.split('/').pop();
                if (container) container.setAttribute('data-tab-mounted', tabId);
                document.querySelectorAll('.admin-nav__tab').forEach(function(btn) {
                    btn.classList.toggle('active', btn.getAttribute('data-tab-id') === tabId);
                    btn.setAttribute('aria-selected', btn.getAttribute('data-tab-id') === tabId ? 'true' : 'false');
                });
            }
        });
        // URL hash sync
        document.body.addEventListener('click', function(evt) {
            var tab = evt.target.closest('[data-tab-id]');
            if (tab) history.replaceState(null, '', '#' + tab.getAttribute('data-tab-id'));
        });
        window.addEventListener('hashchange', function() {
            var hash = window.location.hash.replace('#', '');
            if (hash) {
                var tab = document.querySelector('[data-tab-id="' + hash + '"]');
                if (tab && document.getElementById('admin-tab-container').getAttribute('data-tab-mounted') !== hash) tab.click();
            }
        });
        (function() {
            var hash = window.location.hash.replace('#', '');
            if (hash && hash !== 'race-day') {
                var tab = document.querySelector('[data-tab-id="' + hash + '"]');
                if (tab) setTimeout(function() { tab.click(); }, 0);
            }
        })();
    </script>
    <script>
        document.body.addEventListener('closeRacerModal', function() {
            if (bootstrap.Modal.getInstance(document.getElementById('racerModal'))) bootstrap.Modal.getInstance(document.getElementById('racerModal')).hide();
        });
        document.body.addEventListener('closeQuoteModal', function() {
            if (bootstrap.Modal.getInstance(document.getElementById('quoteModal'))) bootstrap.Modal.getInstance(document.getElementById('quoteModal')).hide();
        });
        document.body.addEventListener('closeTrackModal', function() {
            if (bootstrap.Modal.getInstance(document.getElementById('trackModal'))) bootstrap.Modal.getInstance(document.getElementById('trackModal')).hide();
        });
        document.body.addEventListener('closeTeamModal', function() {
            if (bootstrap.Modal.getInstance(document.getElementById('teamModal'))) bootstrap.Modal.getInstance(document.getElementById('teamModal')).hide();
        });
        document.body.addEventListener('closeSeasonsModal', function() {
            if (bootstrap.Modal.getInstance(document.getElementById('seasonsModal'))) bootstrap.Modal.getInstance(document.getElementById('seasonsModal')).hide();
        });
    </script>
    <script>
        document.body.addEventListener('htmx:afterSwap', function(evt) {
            if (evt.detail.target && evt.detail.target.matches('#racerModal .modal-body')) {
                new bootstrap.Modal(document.getElementById('racerModal')).show();
            }
        });
    </script>
    <script src="/static/js/admin.js"></script>
    </div>
</body>
</html>
{{end}}
