{{define "adminFooter"}}
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.body.addEventListener('closeRacerModal', function() {
            if (bootstrap.Modal.getInstance(document.getElementById('racerModal'))) bootstrap.Modal.getInstance(document.getElementById('racerModal')).hide();
        });
        document.body.addEventListener('closeQuoteModal', function() {
            if (bootstrap.Modal.getInstance(document.getElementById('quoteModal'))) bootstrap.Modal.getInstance(document.getElementById('quoteModal')).hide();
        });
        document.body.addEventListener('closeTrackModal', function() {
            if (bootstrap.Modal.getInstance(document.getElementById('trackModal'))) bootstrap.Modal.getInstance(document.getElementById('trackModal')).hide();
        });
        document.body.addEventListener('closeTeamModal', function() {
            if (bootstrap.Modal.getInstance(document.getElementById('teamModal'))) bootstrap.Modal.getInstance(document.getElementById('teamModal')).hide();
        });
        document.body.addEventListener('closeSeasonsModal', function() {
            if (bootstrap.Modal.getInstance(document.getElementById('seasonsModal'))) bootstrap.Modal.getInstance(document.getElementById('seasonsModal')).hide();
        });
    </script>
    <script>
        document.body.addEventListener('htmx:afterSwap', function(evt) {
            if (evt.detail.target && evt.detail.target.matches('#racerModal .modal-body')) {
                new bootstrap.Modal(document.getElementById('racerModal')).show();
            }
        });
    </script>
    <script src="/static/js/admin.js"></script>
</body>
</html>
{{end}}
