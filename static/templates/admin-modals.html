{{define "adminModals"}}
<!-- Racer Modal -->
<div class="modal fade" id="racerModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="racerModalLabel">Edit Racer</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="racer-form">
                    <input type="hidden" name="id" id="racer-id">
                    <div class="mb-3 text-center" id="racer-pic-preview-container">
                        <img src="" id="racer-pic-preview" class="rounded-circle mb-2" width="80" height="80" style="display:none; object-fit: cover; border: 3px solid var(--heat-red)">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Name</label>
                        <input type="text" class="form-control" name="name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Profile Picture</label>
                        <div class="input-group">
                            <input type="text" class="form-control" name="profile_picture" id="profile_picture" placeholder="Default avatar will be used if empty">
                            <button class="btn btn-outline-secondary" type="button" onclick="document.getElementById('imageInput').click()">
                                <i aria-hidden="true" class="fa-solid fa-upload"></i>
                            </button>
                        </div>
                        <input type="file" id="imageInput" accept="image/*" style="display:none" onchange="uploadImage(this)">
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-6">
                            <label class="form-label small fw-bold">Car Name</label>
                            <input type="text" class="form-control" name="car_name" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label small fw-bold">Car Color</label>
                            <div class="d-flex align-items-center gap-2">
                                <input type="color" class="form-control form-control-color" name="car_color" id="car_color" value="#d40000" style="width:50px;height:38px;padding:2px" onchange="updateCarPreview(this.value)">
                                <input type="text" class="form-control" name="car_color_text" id="car_color_text" placeholder="#d40000" value="#d40000" oninput="document.getElementById('car_color').value=this.value;updateCarPreview(this.value)" style="font-family:monospace;font-size:0.85rem">
                            </div>
                            <div class="mt-2 d-flex gap-1 flex-wrap" id="color-swatches"></div>
                            <div class="mt-2 text-center" id="car-preview" style="border-radius:8px;padding:8px;background:#f0f0f0">
                                <div style="width:100%;height:40px;border-radius:6px;border:2px solid #ddd;display:flex;align-items:center;justify-content:center;font-size:0.7rem;color:#fff;font-weight:bold;text-shadow:0 1px 2px rgba(0,0,0,0.5);letter-spacing:1px;text-transform:uppercase" id="car-preview-bar">HEAT</div>
                            </div>
                        </div>
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-4">
                            <label class="form-label small fw-bold">Points</label>
                            <input type="number" class="form-control" name="points" required>
                        </div>
                        <div class="col-4">
                            <label class="form-label small fw-bold">Rank</label>
                            <input type="number" class="form-control" name="rank" required>
                        </div>
                        <div class="col-4">
                            <label class="form-label small fw-bold">Board Gap</label>
                            <input type="number" class="form-control" name="position" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Save Racer</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Quote Modal -->
<div class="modal fade" id="quoteModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="quoteModalLabel">Edit Quote</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="quote-form">
                    <input type="hidden" name="id" id="quote-id">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Quote Text</label>
                        <textarea class="form-control" name="text" id="quote-text" rows="3" required placeholder="Enter F1 quote..."></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Author</label>
                        <input type="text" class="form-control" name="author" id="quote-author" placeholder="Murray Walker">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Save Quote</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Track Modal -->
<div class="modal fade" id="trackModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="trackModalLabel">Edit Track</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="track-form">
                    <input type="hidden" name="id" id="track-id">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Track ID</label>
                        <input type="text" class="form-control" name="id_visible" id="track-id-visible" required placeholder="e.g. zandvoort">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Track Name</label>
                        <input type="text" class="form-control" name="name" required placeholder="e.g. Circuit Zandvoort">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Country</label>
                        <input type="text" class="form-control" name="country" required placeholder="e.g. Netherlands">
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-6">
                            <label class="form-label small fw-bold">Length (km)</label>
                            <input type="number" class="form-control" name="length_km" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label small fw-bold">Lap Record</label>
                            <input type="text" class="form-control" name="lap_record" placeholder="e.g. 1:09.000">
                        </div>
                    </div>
                    <div class="mb-3">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="refresh-geojson" name="refresh_geojson" checked>
                            <label class="form-check-label small fw-bold" for="refresh-geojson">Live GeoJSON Refresh</label>
                        </div>
                        <div class="form-text mt-0 mb-2">Enable to update car positions on the map in real-time.</div>
                    </div>
                    <div class="mb-3 border rounded p-3 bg-light">
                        <div class="form-check form-switch mb-2">
                            <input class="form-check-input" type="checkbox" id="use-map-image" name="use_map_image" onchange="document.getElementById('map-image-settings').style.display = this.checked ? 'block' : 'none'">
                            <label class="form-check-label small fw-bold" for="use-map-image">Use Map Image Background</label>
                        </div>
                        <div id="map-image-settings" style="display:none">
                            <label class="form-label small fw-bold">Map Image URL</label>
                            <div class="input-group mb-2">
                                <input type="text" class="form-control" name="map_image_url" id="map-image-url">
                                <button class="btn btn-outline-secondary" type="button" onclick="document.getElementById('map-image-upload').click()">Upload</button>
                            </div>
                            <input type="file" id="map-image-upload" style="display:none" accept="image/*" onchange="uploadMapImage(this)">
                            <button type="button" class="btn btn-sm btn-outline-info w-100" onclick="extractTrackFromAI()">
                                <i aria-hidden="true" class="fa-solid fa-wand-magic-sparkles me-1"></i> Extract Track with AI (Alpha)
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Save Track</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Team Modal -->
<div class="modal fade" id="teamModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="teamModalLabel">Edit Team</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p class="text-muted text-center py-4"><i aria-hidden="true" class="fa-solid fa-spinner fa-spin me-2"></i>Loading...</p>
            </div>
        </div>
    </div>
</div>

<!-- Seasons Modal -->
<div class="modal fade" id="seasonsModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">New Season</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p class="text-muted text-center py-4"><i aria-hidden="true" class="fa-solid fa-spinner fa-spin me-2"></i>Loading...</p>
            </div>
        </div>
    </div>
</div>

<!-- Stats Modal -->
<div class="modal fade" id="statsModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="statsModalLabel">Edit Driver Stats</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="stats-form">
                    <input type="hidden" name="id" id="stats-id">
                    <input type="hidden" name="racer_id" id="stats-racer-id">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Driver</label>
                        <select class="form-select" id="stats-racer-select" required>
                            <option value="">Select a driver...</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Races</label>
                        <input type="number" class="form-control" name="races" id="stats-races" min="0" required>
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-4">
                            <label class="form-label small fw-bold text-warning">Gold (1st)</label>
                            <input type="number" class="form-control" name="gold" id="stats-gold" min="0" required>
                        </div>
                        <div class="col-4">
                            <label class="form-label small fw-bold text-secondary">Silver (2nd)</label>
                            <input type="number" class="form-control" name="silver" id="stats-silver" min="0" required>
                        </div>
                        <div class="col-4">
                            <label class="form-label small fw-bold" style="color:#cd7f32">Bronze (3rd)</label>
                            <input type="number" class="form-control" name="bronze" id="stats-bronze" min="0" required>
                        </div>
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-4">
                            <label class="form-label small fw-bold">Fastest Laps</label>
                            <input type="number" class="form-control" name="fastest_laps" id="stats-fastest-laps" min="0" required>
                        </div>
                        <div class="col-4">
                            <label class="form-label small fw-bold">DNF</label>
                            <input type="number" class="form-control" name="dnf" id="stats-dnf" min="0" required>
                        </div>
                        <div class="col-4">
                            <label class="form-label small fw-bold">DNS</label>
                            <input type="number" class="form-control" name="dns" id="stats-dns" min="0" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Save Stats</button>
                </form>
            </div>
        </div>
    </div>
</div>
{{end}}
