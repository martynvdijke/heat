{{template "adminHeader" .}}
        <div class="tab-content">
            <div class="tab-pane fade show active" id="cat-race" role="tabpanel">
                <div class="row">
                    <div class="col-12">
                        <ul class="nav nav-pills mb-3" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#race-pane" type="button" role="tab"><i class="fa-solid fa-gauge-high me-1"></i>Race</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#qualification-pane" type="button" role="tab"><i class="fa-solid fa-random me-1"></i>Qualification</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#racers-pane" type="button" role="tab"><i class="fa-solid fa-users me-1"></i>Racers</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tracks-pane" type="button" role="tab"><i class="fa-solid fa-road me-1"></i>Tracks</button>
                            </li>
                        </ul>
                    </div>
                </div>
                {{template "racePanes" .}}
            </div>
            {{template "resultsPanes" .}}
            {{template "contentPanes" .}}
            {{template "settingsPanes" .}}
            {{template "systemPanes" .}}
        </div>
        {{template "adminModals" .}}
{{template "adminFooter" .}}
