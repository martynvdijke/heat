{{template "adminHeader" .}}
        <div id="admin-tab-container" role="tabpanel" data-tab-mounted="race-day">
            {{template "tabRaceDay" .}}
        </div>

        <!-- Shared asset upload/edit modal. Lives outside the tab container so
             the Library tab and extension detail can both open it. -->
        <div class="modal fade" id="assetModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-lg modal-dialog-scrollable">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="assetModalTitle">Upload Asset</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="asset-id" value="0">
                        <div class="mb-3">
                            <label class="form-label small fw-bold" for="asset-file">File</label>
                            <input type="file" class="form-control" id="asset-file" accept=".pdf,.png,.jpg,.jpeg,.webp,.gif,application/pdf,image/png,image/jpeg,image/webp,image/gif">
                            <div class="form-text" id="asset-file-help">PDF, PNG, JPG, WebP, or GIF. Maximum 25 MB. Identical files are not stored twice.</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold" for="asset-title">Title</label>
                            <input type="text" class="form-control" id="asset-title" maxlength="200" placeholder="e.g. Heavy Rain unofficial map">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold" for="asset-description">Description</label>
                            <textarea class="form-control" id="asset-description" rows="2" maxlength="2000" placeholder="What is this file? Who made it?"></textarea>
                        </div>
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label small fw-bold" for="asset-kind">Kind</label>
                                <select class="form-select" id="asset-kind" onchange="libSyncAssetForm()">
                                    <option value="map">Map</option>
                                    <option value="extension">Extension file</option>
                                    <option value="other">Other</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-bold" for="asset-extension">Extension</label>
                                <select class="form-select" id="asset-extension">
                                    <option value="0">None</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-bold" for="asset-track">Track</label>
                                <select class="form-select" id="asset-track">
                                    <option value="">None</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-check form-switch mt-3" id="asset-background-wrap">
                            <input class="form-check-input" type="checkbox" id="asset-set-background">
                            <label class="form-check-label small" for="asset-set-background">Use this image as the selected track's map background</label>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn btn-primary" onclick="libSaveAsset()">
                            <i class="fa-solid fa-upload me-1"></i><span id="asset-save-label">Upload</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
{{template "adminFooter" .}}
