{{define "tabDrivers"}}
                <ul class="nav nav-pills mb-3" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="racers-subtab" data-bs-toggle="tab" data-bs-target="#racers-pane" type="button" role="tab"><i class="fa-solid fa-users me-1"></i>Racers</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="teams-subtab" data-bs-toggle="tab" data-bs-target="#teams-pane" type="button" role="tab"><i class="fa-solid fa-people-group me-1"></i>Teams</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#quotes-pane" type="button" role="tab"><i class="fa-solid fa-microphone me-1"></i>Quotes</button>
                    </li>
                </ul>
                <div class="tab-content">
                    <div class="tab-pane fade show active" id="racers-pane">
                        <div class="card">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <span><i class="fa-solid fa-users me-2 text-danger"></i>Racer Standings</span>
                                <button class="btn btn-sm btn-success" hx-get="/api/html/racers/0/edit" hx-target="#racerModal .modal-body" hx-swap="innerHTML" hx-indicator=".htmx-indicator" data-bs-toggle="modal" data-bs-target="#racerModal">
                                    <i class="fa-solid fa-plus me-1"></i> Add Racer
                                </button>
                            </div>
                            <div class="card-body p-0">
                                <div class="table-responsive">
                                    <table class="table table-hover align-middle mb-0">
                                        <thead>
                                            <tr>
                                                <th class="ps-4">Rank</th>
                                                <th>Driver</th>
                                                <th>Car</th>
                                                <th>Points</th>
                                                <th>Pos</th>
                                                <th>Share</th>
                                                <th class="text-end pe-4">Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody id="racer-list" hx-get="/api/html/racers" hx-trigger="load" hx-swap="outerHTML">
                                            <tr><td colspan="7" class="text-center text-muted py-4"><i class="fa-solid fa-spinner fa-spin me-2"></i>Loading racers...</td></tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="tab-pane fade" id="teams-pane">
                        <div class="card">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <span><i class="fa-solid fa-people-group me-2 text-danger"></i>Constructor Teams</span>
                                <button class="btn btn-sm btn-success" hx-get="/api/html/teams/0/edit" hx-target="#teamModal .modal-body" hx-swap="innerHTML" hx-indicator=".htmx-indicator" data-bs-toggle="modal" data-bs-target="#teamModal">
                                    <i class="fa-solid fa-plus me-1"></i> Add Team
                                </button>
                            </div>
                            <div class="card-body p-0">
                                <div class="table-responsive">
                                    <table class="table table-hover align-middle mb-0">
                                        <thead>
                                            <tr>
                                                <th class="ps-4" style="width:40px">Color</th>
                                                <th>Name</th>
                                                <th class="text-end pe-4">Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody id="team-list" hx-get="/api/html/teams" hx-trigger="load" hx-swap="outerHTML">
                                            <tr><td colspan="3" class="text-center text-muted py-4"><span class="htmx-indicator"><i class="fa-solid fa-spinner fa-spin me-2"></i>Loading teams...</span></td></tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="tab-pane fade" id="quotes-pane">
                        <div class="card">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <span><i class="fa-solid fa-microphone me-2 text-danger"></i>Commentator Quotes</span>
                                <button class="btn btn-sm btn-success" hx-get="/api/html/quotes/0/edit" hx-target="#quoteModal .modal-body" hx-swap="innerHTML" hx-indicator=".htmx-indicator" data-bs-toggle="modal" data-bs-target="#quoteModal">
                                    <i class="fa-solid fa-plus me-1"></i> Add Quote
                                </button>
                            </div>
                            <div class="card-body p-0">
                                <div class="table-responsive">
                                    <table class="table table-hover align-middle mb-0">
                                        <thead>
                                            <tr>
                                                <th class="ps-4" style="width: 70%">Quote</th>
                                                <th>Author</th>
                                                <th class="text-end pe-4">Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody id="quote-list">
                                            <tr><td colspan="3" class="text-center text-muted py-4"><span class="htmx-indicator"><i class="fa-solid fa-spinner fa-spin me-2"></i>Loading quotes...</span></td></tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Drivers-owned modals -->
                <div class="modal fade" id="racerModal" tabindex="-1">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title" id="racerModalLabel">Edit Racer</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <form id="racer-form">
                                    <input type="hidden" name="id" id="racer-id">
                                    <div class="mb-3 text-center" id="racer-pic-preview-container">
                                        <img src="" id="racer-pic-preview" class="rounded-circle mb-2" width="80" height="80" style="display:none; object-fit: cover; border: 3px solid var(--heat-red)">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label small fw-bold">Name</label>
                                        <input type="text" class="form-control" name="name" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label small fw-bold">Profile Picture</label>
                                        <div class="input-group">
                                            <input type="text" class="form-control" name="profile_picture" id="profile_picture" placeholder="Default avatar will be used if empty">
                                            <button class="btn btn-outline-secondary" type="button" onclick="document.getElementById('imageInput').click()">
                                                <i aria-hidden="true" class="fa-solid fa-upload"></i>
                                            </button>
                                        </div>
                                        <input type="file" id="imageInput" accept="image/*" style="display:none" onchange="uploadImage(this)">
                                    </div>
                                    <div class="row g-3 mb-3">
                                        <div class="col-6">
                                            <label class="form-label small fw-bold">Car Name</label>
                                            <input type="text" class="form-control" name="car_name" required>
                                        </div>
                                        <div class="col-6">
                                            <label class="form-label small fw-bold">Car Color</label>
                                            <div class="d-flex align-items-center gap-2">
                                                <input type="color" class="form-control form-control-color" name="car_color" id="car_color" value="#d40000" style="width:50px;height:38px;padding:2px" onchange="updateCarPreview(this.value)">
                                                <input type="text" class="form-control" name="car_color_text" id="car_color_text" placeholder="#d40000" value="#d40000" oninput="document.getElementById('car_color').value=this.value;updateCarPreview(this.value)" style="font-family:monospace;font-size:0.85rem">
                                            </div>
                                            <div class="mt-2 d-flex gap-1 flex-wrap" id="color-swatches"></div>
                                            <div class="mt-2 text-center" id="car-preview" style="border-radius:8px;padding:8px;background:#f0f0f0">
                                                <div style="width:100%;height:40px;border-radius:6px;border:2px solid #ddd;display:flex;align-items:center;justify-content:center;font-size:0.7rem;color:#fff;font-weight:bold;text-shadow:0 1px 2px rgba(0,0,0,0.5);letter-spacing:1px;text-transform:uppercase" id="car-preview-bar">HEAT</div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row g-3 mb-3">
                                        <div class="col-4">
                                            <label class="form-label small fw-bold">Points</label>
                                            <input type="number" class="form-control" name="points" required>
                                        </div>
                                        <div class="col-4">
                                            <label class="form-label small fw-bold">Rank</label>
                                            <input type="number" class="form-control" name="rank" required>
                                        </div>
                                        <div class="col-4">
                                            <label class="form-label small fw-bold">Board Gap</label>
                                            <input type="number" class="form-control" name="position" required>
                                        </div>
                                    </div>
                                    <button type="submit" class="btn btn-primary w-100">Save Racer</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal fade" id="teamModal" tabindex="-1">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title" id="teamModalLabel">Edit Team</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <p class="text-muted text-center py-4"><i aria-hidden="true" class="fa-solid fa-spinner fa-spin me-2"></i>Loading...</p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal fade" id="quoteModal" tabindex="-1">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title" id="quoteModalLabel">Edit Quote</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <form id="quote-form">
                                    <input type="hidden" name="id" id="quote-id">
                                    <div class="mb-3">
                                        <label class="form-label small fw-bold">Quote Text</label>
                                        <textarea class="form-control" name="text" id="quote-text" rows="3" required placeholder="Enter F1 quote..."></textarea>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label small fw-bold">Author</label>
                                        <input type="text" class="form-control" name="author" id="quote-author" placeholder="Murray Walker">
                                    </div>
                                    <button type="submit" class="btn btn-primary w-100">Save Quote</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
{{end}}
