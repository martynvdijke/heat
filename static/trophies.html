<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#d40000">
    <title>HEAT: Trophy Room</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <style>
        .trophy-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1.5rem; }
        .trophy-card { background: var(--card-bg, #1a1a2e); border: 1px solid var(--border-color, #333); border-radius: 12px; padding: 1.5rem; text-align: center; transition: all 0.3s ease; }
        .trophy-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .trophy-card.locked { opacity: 0.4; filter: grayscale(1); }
        .achievement-badge { width: 70px; height: 70px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; font-size: 1.75rem; }
        .achievement-badge.gold { background: linear-gradient(135deg, #ffd700, #ffaa00); color: #333; }
        .achievement-badge.silver { background: linear-gradient(135deg, #c0c0c0, #888); color: #333; }
        .achievement-badge.bronze { background: linear-gradient(135deg, #cd7f32, #8b4513); color: #333; }
        .achievement-badge.platinum { background: linear-gradient(135deg, #e5e4e2, #a0a0a0); color: #333; }
        .achievement-badge.special { background: linear-gradient(135deg, #ff6b6b, #ff0000); }
        .progress-bar-mini { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.1); margin-top: 0.5rem; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--secondary)); border-radius: 3px; transition: width 0.5s ease; }
    </style>
</head>
<body>
    <div class="vintage-overlay"></div>
    
    <header class="py-3">
        <div class="container position-relative">
            <div class="d-flex justify-content-between align-items-center">
                <div class="logo">
                    <img src="/static/logo.svg" alt="HEAT Logo" width="60" height="60" class="me-2">
                    <div>HEAT<span>Pedal to the Metal</span></div>
                </div>
                <button class="navbar-toggler d-md-none" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>
            <div class="racing-stripes"></div>
            <div id="mainNav" class="collapse d-md-block">
                <nav class="mt-3 d-flex flex-wrap justify-content-center justify-content-md-end align-items-center gap-3">
                    <ul class="mb-0 d-flex flex-wrap gap-3 list-unstyled justify-content-center">
                        <li><a href="/" class="text-uppercase"><i aria-hidden="true" class="fa-solid fa-house me-2"></i>Home</a></li>
                        <li><a href="/stats.html" class="text-uppercase"><i aria-hidden="true" class="fa-solid fa-chart-line me-2"></i>Statistics</a></li>
                        <li><a href="/trophies.html" class="active text-uppercase"><i aria-hidden="true" class="fa-solid fa-trophy me-2"></i>Trophies</a></li>
                        <li><a href="/controller.html" class="text-uppercase"><i aria-hidden="true" class="fa-solid fa-mobile-screen me-2"></i>Controller</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <main class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1><i aria-hidden="true" class="fa-solid fa-trophy me-2"></i>Trophy Room</h1>
            <select id="driver-select" class="form-select w-auto">
                <option value="">Select Driver</option>
            </select>
        </div>

        <div class="row g-4 mb-5">
            <div class="col-md-4">
                <div class="stat-card">
                    <i aria-hidden="true" class="fa-solid fa-trophy"></i>
                    <span class="stat-value" id="total-trophies">0</span>
                    <span class="stat-label">Wins</span>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card">
                    <i aria-hidden="true" class="fa-solid fa-medal"></i>
                    <span class="stat-value" id="total-badges">0</span>
                    <span class="stat-label">Badges</span>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card">
                    <i aria-hidden="true" class="fa-solid fa-fire"></i>
                    <span class="stat-value" id="completion-rate">0%</span>
                    <span class="stat-label">Complete</span>
                </div>
            </div>
        </div>

        <h3 class="mb-3"><i aria-hidden="true" class="fa-solid fa-crown me-2"></i>Race Wins</h3>
        <div class="trophy-grid mb-5" id="race-wins-grid"></div>

        <h3 class="mb-3"><i aria-hidden="true" class="fa-solid fa-flag-checkered me-2"></i>Podium Finishes</h3>
        <div class="trophy-grid mb-5" id="podium-grid"></div>

        <h3 class="mb-3"><i aria-hidden="true" class="fa-solid fa-stopwatch me-2"></i>Speed Records</h3>
        <div class="trophy-grid mb-5" id="speed-grid"></div>

        <h3 class="mb-3"><i aria-hidden="true" class="fa-solid fa-star me-2"></i>Special Achievements</h3>
        <div class="trophy-grid" id="special-grid"></div>
    </main>

    <footer class="py-5 mt-5">
        <div class="container text-center">
            <p class="mb-0 text-uppercase fw-bold"><i aria-hidden="true" class="fa-solid fa-flag-checkered mx-2"></i> 2026 Heat Racing Federation <i aria-hidden="true" class="fa-solid fa-flag-checkered mx-2"></i></p>
            <span class="small opacity-50 text-uppercase letter-spacing-2 mt-2 d-block">Developed for legends. Driven by heat.</span>
            <span class="small opacity-50 text-uppercase letter-spacing-2 mt-2 d-block" id="version-display">v{{VERSION}}</span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="/static/js/trophies.js"></script>
</body>
</html>
