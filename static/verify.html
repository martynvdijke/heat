<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#d40000">
    <title>Sign in - HEAT Racing</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <style>
        :root { --heat-red: #d40000; --heat-dark: #111; }
        body { background: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; min-height: 100vh; }
        .verify-card { background: white; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); max-width: 460px; width: 100%; overflow: hidden; }
        .verify-header { background: linear-gradient(135deg, var(--heat-dark), #333); color: white; padding: 1.5rem; text-align: center; }
        .verify-header h4 { margin: 0; font-weight: 700; }
        .version-footer { text-align: center; padding: 1rem; color: #999; font-size: 0.75rem; }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="verify-card mx-auto" id="verify-card">
            <div class="verify-header">
                <h4><i class="fa-solid fa-flag-checkered me-2"></i>HEAT Racing</h4>
            </div>
            <div class="p-4 text-center" id="verify-body">
                <div class="spinner-border text-danger" role="status"></div>
                <p class="text-muted mt-3 mb-0">Checking your sign-in link...</p>
            </div>
        </div>
        <div class="version-footer">HEAT Racing Companion &mdash; {{VERSION}}</div>
    </div>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <script src="/static/js/verify.js"></script>
</body>
</html>
